            '<div class="riga-in"><input type="text" id="f-' + k + '" data-ga="' + k + '" value="' + esc(v) + '" placeholder="' + (k === 'ga_command' || k === 'ga_temperature' ? '1/1/1' : '—') + '" autocomplete="off" spellcheck="false" inputmode="text" data-no-tr>' +
            '<button type="button" class="mini" onclick="KNX.scegliEts(\'' + k + '\')" title="Scegli fra gli indirizzi importati da ETS"' + (S.ets.totale ? '' : ' disabled') + '><i data-lucide="list"></i></button>' +
            '<button type="button" class="mini" id="leggi-' + k + '" onclick="KNX.leggiBus(\'' + k + '\')" title="Chiedi il valore al bus (lettura: non muove niente)"><i data-lucide="radio"></i></button></div>' +
            '<div class="nota-ga" id="nota-' + k + '"></div>' +
            '<div class="aiuto">' + esc(info.d) + '</div></div>';
    }

    function htmlUsi(d) {
        const u = d.usi || {};
        const pezzi = [];
        (u.stanze || []).forEach(s => pezzi.push(['door-open', s, 'Stanza']));
        (u.gruppi || []).forEach(s => pezzi.push(['layers', s, 'Gruppo']));
        (u.scene || []).forEach(s => pezzi.push(['sparkles', s, 'Scena']));
        (u.automazioni || []).forEach(s => pezzi.push(['zap', s, 'Automazione']));
        if (u.allarme) pezzi.push(['bell', 'Allarme', '']);
        let h = '<div class="sezione"><h3><i data-lucide="waypoints"></i>Dove è usato</h3>';
        if (pezzi.length) h += '<div class="usi">' + pezzi.map(p => '<span class="uso" title="' + esc(p[2]) + '"><i data-lucide="' + p[0] + '"></i><span data-no-tr>' + esc(p[1]) + '</span></span>').join('') + '</div>';
        else h += '<div class="nessun-uso">Non è ancora in nessuna stanza, scena o automazione.</div>';
        return h + '</div>';
    }

    /* la scheda "adesso" in cima al cassetto: lo stato vero, con le prove sul bus */
    function aggiornaAdesso() {
        const c = S.cassetto;
        const box = $('adesso');
        if (!c || !box) return;
        const d = S.perId[c.id];
        if (!d) return;
        const p = pasticca(d);
        let grande = '', dett = [], extra = '';
        if (!gwSu()) { grande = '<span>Bus non collegato</span>'; dett.push('<span>Lo stato arriverà quando il gateway risponde</span>'); }
        else if (d.errore) { grande = '<span style="color:var(--rosso)">Non caricato</span>'; }
        else if (!haSorgenteStato(d)) { grande = '<span>Solo comando</span>'; dett.push('<span>Senza indirizzo di stato l\'app mostra l\'ultimo comando mandato, non lo stato vero</span>'); }
        else if (!d.visto) { grande = '<span>In attesa</span>'; dett.push('<span>Il bus non ha ancora mandato nessun valore per questo dispositivo</span>'); }
        else if (d.dominio === 'cover') {
            const pos = d.posizione;
            grande = pos == null ? '<span>—</span>' : (pos <= 0 ? '<span>Chiusa</span>' : pos >= 100 ? '<span>Aperta</span>' : '<span data-no-tr>' + pos + '%</span> <small>aperta</small>');
            if (pos != null) extra = '<div class="barra-pos"><i style="width:' + Math.max(0, Math.min(100, pos)) + '%"></i></div>';
        } else if (d.dominio === 'climate') {
            const cl = d.clima || {};
            grande = '<span data-no-tr>' + (cl.attuale != null ? Number(cl.attuale).toFixed(1) + '°' : '—') + '</span> <small><span>desiderata</span> <span data-no-tr>' + (cl.desiderata != null ? Number(cl.desiderata).toFixed(1) + '°' : '—') + '</span></small>';
            if (cl.modo) dett.push('<span>' + esc({ heat: 'Riscaldamento', cool: 'Raffrescamento', auto: 'Automatico', off: 'Spento', fan_only: 'Solo ventola', dry: 'Deumidifica' }[cl.modo] || cl.modo) + '</span>');
        } else {
            grande = d.stato === 'on' ? '<span style="color:var(--verde)">Acceso</span>' + (d.dimmer && d.luminosita != null ? ' <small data-no-tr>' + d.luminosita + '%</small>' : '') : '<span>Spento</span>';
        }
        if (gwSu() && d.visto) dett.unshift('<i data-lucide="activity"></i><span>Ultimo messaggio dal bus:</span> <span>' + esc(quandoFa(d.visto)) + '</span>');
        if (gwSu() && !d.sul_bus && !d.errore) dett.push('<span style="color:var(--ambra)">Non è caricato sul bus: salva di nuovo o controlla gli indirizzi</span>');
        let prove = '';
        if ((d.dominio === 'light' || d.dominio === 'switch') && gwSu()) {
            prove = '<div class="prove"><button class="btn piccolo" type="button" data-azione="accendi" onclick="KNX.prova(\'accendi\')" title="Manda ACCESO all\'indirizzo di comando"><i data-lucide="power"></i><span>Accendi</span></button>' +
                    '<button class="btn piccolo" type="button" data-azione="spegni" onclick="KNX.prova(\'spegni\')" title="Manda SPENTO all\'indirizzo di comando"><span>Spegni</span></button></div>';
        }
        const html = '<div class="adesso"><div class="t"><div class="grande">' + grande + '</div>' + extra + (dett.length ? '<div class="dett">' + dett.join('<span>·</span>') + '</div>' : '') + '</div>' + prove + '</div>';
        /* si riscrive solo se e' cambiato qualcosa; se il fuoco era su Accendi/Spegni ci torna */
        if (box._html !== html) {
            const a = document.activeElement;
            const azione = a && box.contains(a) ? a.dataset.azione : '';
            box.innerHTML = html;
            box._html = html;
            icone(box);
            if (azione) { const n = box.querySelector('[data-azione="' + azione + '"]'); if (n) n.focus({ preventScroll: true }); }
        }
        /* titolo del cassetto: se qualcuno lo ha rinominato altrove */
        const t = $('cas-titolo');
        if (t && !sporco()) t.textContent = d.nome;
    }

    function mostraBozza(bozza) {
        const box = $('bozza');
        if (!box) return;
        const d = new Date(bozza.quando);
        box.innerHTML = '<div class="bozza"><i data-lucide="history"></i><span class="t"><span>Avevi lasciato delle modifiche non salvate</span> <span data-no-tr>(' +
            esc(d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })) + ')</span>.</span>' +
            '<button type="button" onclick="KNX.riprendiBozza()">Riprendi</button><button type="button" onclick="KNX.scartaBozza()" style="color:var(--fioco)">Scarta</button></div>';
        icone(box);
        S.cassetto.bozza = bozza;
    }

    /* note sotto gli indirizzi: forma, nome da ETS, DPT sospetto, gia' usato da un altro */
    function usatiDaAltri() {
        const mappa = {};
        const mio = S.cassetto && S.cassetto.id;
        ((S.dati && S.dati.dispositivi) || []).forEach(d => {
            if (d.entity_id === mio) return;
            const campi = campiDi(d.dominio);
            Object.keys(campi).forEach(k => { const v = (d.indirizzi || {})[k]; if (v) (mappa[v] = mappa[v] || []).push({ id: d.entity_id, nome: d.nome, ruolo: campi[k].t }); });
        });
        return mappa;
    }
    function aggiornaNoteGa() {
        const c = S.cassetto;
        if (!c || !c.valori || !$('cas-corpo')) return;
        const altri = usatiDaAltri();
        const valori = leggiModulo().indirizzi;
        const campi = campiDi(c.dominio);
        $('cas-corpo').querySelectorAll('[data-ga]').forEach(inp => {
            const k = inp.dataset.ga, v = inp.value.trim();
            const nota = $('nota-' + k), campo = $('c-' + k);
            if (!nota) return;
            campo.classList.remove('errore');
            campo.classList.toggle('pieno', !!v);
            if (!v) { nota.className = 'nota-ga'; nota.innerHTML = ''; return; }
            if (!gaValido(v)) {
                campo.classList.add('errore');
                nota.className = 'nota-ga errore';
                nota.innerHTML = '<i data-lucide="circle-alert"></i><span>Forma non valida: si scrive come 1/1/1 (principale 0–31, medio 0–7, finale 0–255)</span>';
                icone(nota); return;
            }
            const pezzi = [];
            let cls = 'ok';
            const e = S.ets.per[v];
            if (e) {
                pezzi.push('<i data-lucide="file-spreadsheet"></i><span data-no-tr>' + esc(e.name || '') + (e.dpt ? ' · DPT ' + esc(e.dpt) : '') + '</span>');
                const att = (campi[k] || {}).att;
                if (e.dpt && att && !att.test(e.dpt)) { cls = 'avviso'; pezzi.push('<span>— il DPT non è quello tipico di questo campo (' + esc(campi[k].dpt) + ')</span>'); }
            }
            const doppio = Object.keys(campi).filter(x => x !== k && valori[x] === v);
            if (doppio.length) { cls = 'avviso'; pezzi.push('<span>È scritto anche nel campo «' + esc((campi[doppio[0]] || {}).t || doppio[0]) + '»</span>'); }
            const chi = altri[v];
            if (chi && chi.length) {
                cls = 'avviso';
                pezzi.push('<i data-lucide="triangle-alert"></i><span>Già usato da</span> <button type="button" class="link" data-no-tr data-id="' + esc(chi[0].id) + '" onclick="KNX.salta(this.dataset.id)">' + esc(chi[0].nome) + '</button> <span>(' + esc(chi[0].ruolo) + ')</span>' + (chi.length > 1 ? ' <span data-no-tr>+' + (chi.length - 1) + '</span>' : ''));
            }
            nota.className = 'nota-ga ' + cls;
            nota.innerHTML = pezzi.join(' ');
            icone(nota);
        });
    }
    function controllaNome() {
        const c = S.cassetto;
        const inp = $('f-nome'), nota = $('nota-nome');
        if (!inp || !nota) return;
        const v = norm(inp.value.trim());
        const doppio = v && ((S.dati && S.dati.dispositivi) || []).find(d => d.entity_id !== c.id && norm(d.nome) === v);
        nota.className = 'nota-ga' + (doppio ? ' avviso' : '');
        nota.innerHTML = doppio ? '<i data-lucide="triangle-alert"></i><span>C\'è già un dispositivo con questo nome: sull\'app saranno indistinguibili.</span>' : '';
        icone(nota);
        const sc = $('scelta-nome');
        if (sc) sc.style.display = (c.modo === 'modifica' && inp.value.trim() !== c.orig.nome) ? 'flex' : 'none';
    }
    function aggiornaSalva() {
        const b = $('bt-salva');
        if (!b || !S.cassetto) return;
        if (S.cassetto.modo === 'modifica') b.disabled = !sporco();
    }

    /* un solo ascoltatore per tutto il modulo */
    $('cas-corpo').addEventListener('input', e => {
        const t = e.target;
        if (t.id === 'ets-q') {
            /* la ricerca del selettore di un campo vive nel suo cassetto; quella dell'elenco ETS e del passo 1 in S.etsQ */
            if (S.cassetto && S.cassetto.scegliPer) S.cassetto.q = t.value; else S.etsQ = t.value;
            disegnaListaEts();
            return;
        }
        if (!S.cassetto || !S.cassetto.orig) return;
        if (t.name === 'nome-cliente') { S.cassetto.nomeCliente = t.value; salvaBozza(); return; }
        if (t.dataset.ga) {
            if (S.cassetto.proposti) delete S.cassetto.proposti[t.dataset.ga];
            aggiornaNoteGa();
            const r = $('risposta-' + t.dataset.ga); if (r) r.remove();
        }
        if (t.dataset.f === 'nome') controllaNome();
        aggiornaSalva();
        salvaBozza();
    });
    $('cas-corpo').addEventListener('change', e => {
        if (!S.cassetto || !S.cassetto.orig) return;
        /* la scelta del nome sull'app sta nel cassetto: sopravvive ai ridisegni del modulo */
        if (e.target.name === 'nome-cliente') S.cassetto.nomeCliente = e.target.value;
        aggiornaSalva(); salvaBozza();
    });
    /* Invio in un campo = il pulsante Salva, e solo se il pulsante si puo' premere: non durante un
       salvataggio in corso, non a modulo invariato. Il tasto tenuto giu' non ripete. */
    $('cas-corpo').addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.repeat || e.isComposing || e.target.tagName !== 'INPUT' || !S.cassetto || !S.cassetto.orig) return;
        e.preventDefault();
        const b = $('bt-salva');
        if (b && !b.disabled) salva();
    });

    /* --- aggiunta: passo 1, il tipo --- */
    function nuovo(tipoModulo, valori, proposti) {
        S.cassetto = { modo: 'nuovo', passo: 1, id: null, dominio: 'switch', tipoModulo: 'switch' };
        if (tipoModulo) return scegliTipo(tipoModulo, valori, proposti);
        /* il passo 1 parte sempre pulito: non eredita la ricerca di "Indirizzi ETS" */
        S.etsQ = ''; S.etsSolo = 'liberi';
        testaModulo();
        const tipi = [
            ['light', 'lightbulb', 'var(--c-light)', 'Luce', 'Accesa o spenta'],
            ['dimmer', 'sun-medium', 'var(--c-light)', 'Luce dimmerabile', 'Con la luminosità regolabile'],
            ['cover', 'blinds', 'var(--c-cover)', 'Tapparella', 'Su, giù, stop e percentuale'],
            ['climate', 'thermometer', 'var(--c-climate)', 'Termostato', 'Temperatura, caldo/freddo, modalità'],
            ['switch', 'power', 'var(--c-switch)', 'Interruttore', 'Prese, pompe, carichi on/off in genere'],
        ];
        let h = '<div class="sezione"><h3><i data-lucide="shapes"></i>Che cosa vuoi aggiungere?</h3><div class="tipi">' +
            tipi.map((t, i) => '<button type="button" class="tipo' + (i === 4 ? ' largo' : '') + '" style="--c:' + t[2] + '" onclick="KNX.scegliTipo(\'' + t[0] + '\')"><span class="piastra" style="--c:' + t[2] + '"><i data-lucide="' + t[1] + '"></i></span><span><b>' + t[3] + '</b><small>' + t[4] + '</small></span></button>').join('') +
            '</div></div>';
        if (S.ets.totale) {
            h += '<div class="oppure">oppure</div><div class="sezione"><h3><i data-lucide="file-spreadsheet"></i>Parti da un indirizzo del progetto ETS</h3>' +
                 '<div class="aiuto" style="font-size:.8rem;color:var(--fioco);line-height:1.5;margin-top:-4px">Tocca un indirizzo: tipo, nome e gli indirizzi fratelli (lo stato, lo stop, la luminosità…) si compilano da soli.</div>' +
                 '<label class="ets-cerca"><i data-lucide="search"></i><input type="text" id="ets-q" placeholder="Cerca fra gli indirizzi ETS" autocomplete="off" spellcheck="false" value="' + esc(S.etsQ || '') + '"></label><div id="ets-lista"></div></div>';
        } else {
            h += '<div class="oppure">oppure</div><button type="button" class="deposito" onclick="KNX.apriEts()"><span class="ico"><i data-lucide="file-spreadsheet"></i></span><b>Importa il progetto ETS</b>' +
                 '<span>Con gli indirizzi importati, la pagina ti propone nomi e indirizzi già accoppiati.</span></button>';
        }
        $('cas-corpo').innerHTML = h;
        $('cas-piede').innerHTML = '<span class="spazio"></span><button class="btn" type="button" onclick="KNX.chiudi()">Annulla</button>';
        icone($('cas-corpo')); icone($('cas-piede'));
        if (S.ets.totale) disegnaListaEts();
        document.querySelectorAll('.riga.scelta').forEach(r => r.classList.remove('scelta'));
        apriCassetto();
    }
    function scegliTipo(tipoModulo, valori, proposti) {
        const dominio = tipoModulo === 'dimmer' ? 'light' : tipoModulo;
        const vuoto = { nome: '', note: '', stanza: '', indirizzi: {} };
        GA.forEach(k => { vuoto.indirizzi[k] = ''; });
        const v = valori ? Object.assign({}, vuoto, valori, { indirizzi: Object.assign({}, vuoto.indirizzi, valori.indirizzi || {}) }) : vuoto;
        S.cassetto = { modo: 'nuovo', passo: 2, id: null, dominio, tipoModulo, orig: JSON.parse(JSON.stringify(vuoto)), valori: v, proposti: proposti || {}, nomeCliente: 'tieni' };
        disegnaModulo();
        apriCassetto();
        if (!valori) propostaBozza();
        /* composto da ETS: e' gia' lavoro fatto, va in bozza subito (resta anche se la pagina si
           ricarica). Una bozza scritta a mano per lo stesso tipo pero' non si sovrascrive di nascosto. */
        else if (!memo.leggi(chiaveBozza(), null)) scriviBozzaOra(S.cassetto);
        setTimeout(() => { const n = $('f-nome'); if (n && !n.value && window.innerWidth > 760) n.focus(); }, 340);
    }

    /* --- salvare --- */
    /* un salvataggio alla volta PER CASSETTO: un secondo Invio (o un doppio clic) mentre il primo e'
       in viaggio creerebbe un doppione, o rimanderebbe la vecchia 'prima' e farebbe un falso
       "modificato altrove". Il lucchetto sta sul cassetto e non sulla pagina: dopo il salvataggio il
       cassetto e' gia' chiuso mentre si rileggono elenco ed ETS, e un altro dispositivo aperto nel
       frattempo deve potersi salvare subito (su un server lento il suo Salva andava a vuoto). */
    async function salva() {
        const c = S.cassetto;
        if (!c || c.salvando) return;
        c.salvando = true;
        try { await salvaOra(); } finally { c.salvando = false; }
    }
    async function salvaOra() {
        const c = S.cassetto;
        if (!c || !c.orig) return;
        const v = leggiModulo();
        if (c.modo === 'modifica' && !sporco()) return;          // niente da salvare
        const disp = DISPOSIZIONE[c.tipoModulo] || DISPOSIZIONE.switch;
        /* controlli gentili prima di disturbare il server */
        if (!v.nome.trim()) return segnala('c-nome', 'f-nome', 'Serve un nome per il dispositivo.');
        for (const k of GA) {
            if (v.indirizzi[k] && !gaValido(v.indirizzi[k])) return segnala('c-' + k, 'f-' + k, 'C\'è un indirizzo scritto male: si scrive come 1/1/1.');
        }
        for (const k of disp.obbligatori) {
            if (!v.indirizzi[k]) return segnala('c-' + k, 'f-' + k, 'Manca un indirizzo obbligatorio: «' + campiDi(c.dominio)[k].t + '».');
        }
        const b = $('bt-salva');
        const html = b.innerHTML;
        b.disabled = true; b.innerHTML = '<span class="giro"></span><span>Salvo…</span>';
        try {
            let r;
            if (c.modo === 'nuovo') {
                r = await api('/api/knx/dispositivo', { method: 'POST', corpo: { nome: v.nome.trim(), dominio: c.dominio, indirizzi: v.indirizzi, note: v.note.trim(), stanza: v.stanza } });
            } else {
                const corpo = { entity_id: c.id, prima: c.prima };
                if (v.nome !== c.orig.nome) corpo.nome = v.nome.trim();
                if (v.note !== c.orig.note) corpo.note = v.note.trim();
                if (v.stanza !== c.orig.stanza) corpo.stanza = v.stanza;
                const ind = {};
                GA.forEach(k => { if (v.indirizzi[k] !== c.orig.indirizzi[k]) ind[k] = v.indirizzi[k]; });
                if (Object.keys(ind).length) corpo.indirizzi = ind;
                if (corpo.nome && $('scelta-nome')) corpo.nome_cliente = c.nomeCliente === 'sostituisci' ? 'sostituisci' : 'tieni';
                r = await api('/api/knx/dispositivo', { method: 'PUT', corpo });
                if (r._http === 409) {
                    const ok = await chiedi('Mentre avevi aperto questo dispositivo qualcun altro ne ha cambiato il nome o gli indirizzi. Se salvi, le sue modifiche vanno perse.',
                        { titolo: 'Modificato da un\'altra parte', si: 'Salva lo stesso', no: 'Annulla', pericolo: true });
                    if (!ok) { b.disabled = false; b.innerHTML = html; icone(b); return; }
                    corpo.forza = true;
                    r = await api('/api/knx/dispositivo', { method: 'PUT', corpo });
                }
            }
            if (r._http !== 200 || r.status !== 'success') {
                b.disabled = false; b.innerHTML = html; icone(b);
                if (r.campo && $('c-' + r.campo)) return segnala('c-' + r.campo, 'f-' + (r.campo === 'nome' ? 'nome' : r.campo), r.message || 'Dato non valido');
                return avvisa(r.message || r.error || 'Il server non ha salvato.', { titolo: 'Non salvato' });
            }
            clearTimeout(timerBozza);
            memo.togli(chiaveBozzaDi(c));
            const salvatoAlle = Date.now();
            const bus = { ricaricato: 'Viene applicato al bus adesso.', in_coda: 'Viene applicato al bus adesso.', offline: 'Il gateway non risponde: sarà applicato appena torna in linea.', invariato: '', assente: '' }[r.bus] || '';
            const idNuovo = r.entity_id || c.id;
            if (c.modo === 'nuovo') S.nuovi[idNuovo] = true;
            chiudiCassetto();
            await carica(true);
            /* l'elenco ETS ("liberi", "gia' usato da") deve essere giusto prima di riaprire Aggiungi */
            if (S.ets.totale) await caricaEts(salvatoAlle);
            biscotto(c.modo === 'nuovo' ? 'Dispositivo creato' : 'Modifiche salvate', bus, 'bene');
            if (r.avvisi && r.avvisi.length) setTimeout(() => biscotto(r.avvisi[0], r.avvisi.length > 1 ? '+' + (r.avvisi.length - 1) + ' altri avvisi' : '', 'avviso', 7000), 400);
            const riga = document.querySelector('.riga[data-id="' + CSS.escape(idNuovo) + '"]');
            if (riga && c.modo === 'nuovo') riga.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } catch (e) {
            b.disabled = false; b.innerHTML = html; icone(b);
            avvisa(e.message || 'Errore', { titolo: e.tipo === 'sessione' ? 'Sessione scaduta' : 'Non salvato' });
        }
    }
    function segnala(idCampo, idInput, testo) {
        const campo = $(idCampo);
        if (campo) {
            campo.classList.add('errore');
            const f = $('facoltativi');
            if (f && f.contains(campo)) f.classList.add('aperti');
            campo.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
        const inp = $(idInput);
        if (inp) setTimeout(() => inp.focus(), 250);
        biscotto(testo, '', 'male', 4200);
    }

    async function elimina() {
        const c = S.cassetto, d = c && S.perId[c.id];
        if (!d) return;
        const u = d.usi || {};
        /* una riga per cosa: si legge meglio e ognuna si traduce da sola */
        let testo = '«' + d.nome + '» sparisce dall\'impianto.';
        if ((u.stanze || []).length) testo += '\n' + (u.stanze.length === 1 ? 'Viene tolto dalla stanza «' + u.stanze[0] + '».' : 'Viene tolto da ' + u.stanze.length + ' stanze.');
        if ((u.scene || []).length) testo += '\n' + (u.scene.length === 1 ? 'Viene tolto dalla scena «' + u.scene[0] + '».' : 'Viene tolto da ' + u.scene.length + ' scene.');
        if ((u.gruppi || []).length) testo += '\n' + (u.gruppi.length === 1 ? 'Viene tolto dal gruppo «' + u.gruppi[0] + '».' : 'Viene tolto da ' + u.gruppi.length + ' gruppi.');
        if ((u.automazioni || []).length) testo += '\n' + (u.automazioni.length === 1
            ? 'Attenzione: l\'automazione «' + u.automazioni[0] + '» lo usa e andrà corretta a mano.'
            : 'Attenzione: ' + u.automazioni.length + ' automazioni lo usano e andranno corrette a mano.');
        const ok = await chiedi(testo, { titolo: 'Eliminare il dispositivo?', si: 'Elimina', no: 'Annulla', pericolo: true, icona: 'trash-2' });
        if (!ok) return;
        try {
            const r = await api('/api/knx/dispositivo', { method: 'DELETE', corpo: { entity_id: d.entity_id } });
            if (r._http !== 200) return avvisa(r.message || r.error || 'Non eliminato', { titolo: 'Non eliminato' });
            memo.togli('knx_bozza_' + d.entity_id);
            const eliminatoAlle = Date.now();
            chiudiCassetto();
            await carica(true);
            if (S.ets.totale) await caricaEts(eliminatoAlle);
            biscotto('Dispositivo eliminato', d.nome, 'bene');
            if (r.avvisi && r.avvisi.length) await avvisa(r.avvisi.join('\n'), { titolo: 'Da correggere a mano' });
        } catch (e) { avvisa(e.message || 'Errore', { titolo: 'Non eliminato' }); }
    }

    async function duplica() {
        const c = S.cassetto, d = c && S.perId[c.id];
        if (!d) return;
        if (sporco()) {
            const ok = await chiedi('Il duplicato si fa dal dispositivo com\'è salvato: le modifiche non salvate restano qui, in bozza.', { titolo: 'Duplicare adesso?', si: 'Duplica', no: 'Annulla' });
            if (!ok) return;
            scriviBozzaOra(c);
        }
        try {
            const r = await api('/api/knx/dispositivo/duplica', { method: 'POST', corpo: { entity_id: d.entity_id } });
            if (r._http !== 200 || !r.entity_id) return avvisa(r.message || 'Non duplicato', { titolo: 'Non duplicato' });
            S.nuovi[r.entity_id] = true;
            const copiatoAlle = Date.now();
            await carica(true);
            if (S.ets.totale) await caricaEts(copiatoAlle);
            apri(r.entity_id);
            biscotto('Copia creata', 'Ha gli stessi indirizzi dell\'originale: cambiali prima di usarla.', 'avviso', 6000);
            setTimeout(() => { const n = $('f-nome'); if (n) { n.focus(); n.select(); } }, 350);
        } catch (e) { avvisa(e.message || 'Errore', { titolo: 'Non duplicato' }); }
    }

    /* --- prove sul bus: leggere non muove niente; scrivere si fa solo chiedendo --- */
    let provaInCorso = false;
    async function leggiBus(k) {
        if (provaInCorso) return;
        const inp = $('f-' + k);
        const ga = inp ? inp.value.trim() : '';
        if (!ga) return biscotto('Scrivi prima l\'indirizzo da leggere', '', 'avviso');
        if (!gaValido(ga)) return biscotto('Indirizzo scritto male', 'Si scrive come 1/1/1', 'male');
        if (!gwSu()) return biscotto('Il gateway non è collegato', 'La lettura si può fare solo col bus in linea.', 'avviso');
        const b = $('leggi-' + k);
        const mio = S.cassetto;                  // la risposta vale solo per questo cassetto e questo indirizzo
        provaInCorso = true;
        const prima = b.innerHTML;
        b.disabled = true; b.innerHTML = '<span class="giro"></span>';
        try {
            const r = await api('/api/knx/prova', { method: 'POST', corpo: { ga, azione: 'leggi' } });
            if (r._http === 429) return biscotto('Un\'altra prova è in corso', 'Aspetta un istante', 'avviso');
            const inpOra = $('f-' + k);
            if (S.cassetto !== mio || !inpOra || inpOra.value.trim() !== ga) {
                /* nel frattempo si e' passati ad altro: la risposta non va sotto il campo sbagliato,
                   ma se c'e' un valore si dice lo stesso, con l'indirizzo accanto */
                if (r._http === 200 && r.inviato && r.risposta != null) biscotto('Il bus risponde: ' + r.risposta, ga, 'bene');
                return;
            }
            const nota = $('nota-' + k);
            if (!nota) return;
            let el = $('risposta-' + k);
            if (!el) { el = document.createElement('div'); el.id = 'risposta-' + k; nota.parentNode.insertBefore(el, nota.nextSibling); }
            if (r._http !== 200) {
                el.className = 'nota-ga avviso';
                el.innerHTML = '<i data-lucide="circle-alert"></i><span>' + esc(r.message || r.messaggio || 'Lettura non inviata') + '</span>';
            } else if (r.inviato && r.risposta != null) {
                el.className = 'nota-ga bene';
                el.innerHTML = '<i data-lucide="circle-check"></i><span>Il bus risponde:</span> <b class="mono" data-no-tr>' + esc(r.risposta) + '</b>';
            } else {
                el.className = 'nota-ga avviso';
                el.innerHTML = '<i data-lucide="circle-help"></i><span>' + esc(r.inviato ? 'Nessuna risposta: l\'indirizzo esiste ma nessun apparecchio rimanda il valore (normale per molti indirizzi di comando).' : (r.messaggio || r.message || 'Lettura non inviata')) + '</span>';
            }
            icone(el);
        } catch (e) { biscotto(e.message || 'Errore', '', 'male'); }
        finally {
            provaInCorso = false;
            /* il pulsante di adesso, non quello di prima: se il modulo e' stato ridisegnato il vecchio non c'e' piu' */
            const bb = $('leggi-' + k);
            if (bb) { bb.disabled = false; if (bb.querySelector('.giro')) { bb.innerHTML = prima; icone(bb); } }
        }
    }
    async function prova(azione) {
        if (provaInCorso) return;
        const c = S.cassetto;
        const inp = $('f-ga_command');
        const ga = inp ? inp.value.trim() : '';

        const e = S.ets.per[ga];
        const ok = await chiedi('Mando ' + (azione === 'accendi' ? 'ACCESO (1)' : 'SPENTO (0)') + ' sull\'indirizzo ' + ga + (e && e.name ? ' · ' + e.name : '') + '.\nSul bus di casa si muove davvero quello che è collegato a questo indirizzo.',
            { titolo: 'Prova sul bus', si: azione === 'accendi' ? 'Accendi' : 'Spegni', no: 'Annulla', icona: 'power' });
        if (!ok) return;
        provaInCorso = true;
        try {
            const r = await api('/api/knx/prova', { method: 'POST', corpo: { ga, azione } });
            if (r._http === 429) biscotto('Un\'altra prova è in corso', 'Aspetta un istante', 'avviso');
            else biscotto(r.inviato ? 'Comando mandato' : 'Comando non mandato', r.messaggio || '', r.inviato ? 'bene' : 'avviso');
            setTimeout(() => carica(true), 900);
        } catch (e2) { biscotto(e2.message || 'Errore', '', 'male'); }
        finally { provaInCorso = false; }
    }

    /* =================================================================
       7. ETS: import, elenco, scelta di un indirizzo, dispositivo proposto
       ================================================================= */
    const PAROLE_RUOLO = ['on/off', 'on off', 'onoff', 'comando', 'command', 'cmd', 'schalten', 'stato', 'state', 'status', 'feedback', 'fb', 'rm', 'ruckmeldung', 'rueckmeldung',
        'dimming', 'dimmer relativo', 'regolazione', 'valore', 'value', 'luminosita', 'brightness', 'posizione', 'position', 'pos', 'stop', 'step', 'lamelle', 'arresto',
        'su/giu', 'su giu', 'up/down', 'movimento', 'move', 'setpoint', 'set point', 'consegna', 'desiderata', 'impostata', 'ambiente', 'attuale', 'misurata',
        'caldo/freddo', 'heat/cool', 'modalita', 'modo', 'mode', 'hvac', '%',
        /* termostati: senza queste la temperatura ambiente e il setpoint non risultano fratelli */
        'temperatura', 'temperature', 'temperatur', 'raumtemperatur', 'temp', 'sonda', 'ist', 'istwert', 'sollwert', 'comfort', 'komfort',
        /* diciture italiane comuni per il ritorno e per l'on/off ("On / Off" diventa "on/off" prima) */
        'ritorno', 'accesa/spenta', 'acceso/spento', 'accendi/spegni'];
    function radice(nome) {
        /* la barra si attacca per prima: "On / Off" e "on/off" devono dare la stessa parola */
        let t = ' ' + norm(nome).replace(/\s*\/\s*/g, '/').replace(/[_\-–—.,;:()]+/g, ' ') + ' ';
        PAROLE_RUOLO.slice().sort((a, b) => b.length - a.length).forEach(p => { t = t.split(' ' + p + ' ').join(' '); });
        return t.replace(/\s+/g, ' ').trim();
    }
    /* il nome da proporre: quello ETS senza le parole di ruolo, con le maiuscole dell'originale */
    function nomeProposto(nome) {
        const parole = String(nome || '').replace(/\s*\/\s*/g, '/').replace(/[_]+/g, ' ').split(/\s+/).filter(Boolean);
        const ruolo = new Set(PAROLE_RUOLO.map(norm));
        const diRuolo = p => ruolo.has(norm(p).replace(/[()\-–—.,;:]/g, ''));
        /* Si tolgono le parole di ruolo solo IN CODA, dove le mette ETS ("Luce cucina stato on/off",
           "Termostato camera temperatura ambiente"): in mezzo o in testa fanno parte del nome
           ("Pompa ritorno acqua", "Sonda esterna"). Una parola col trattino si guarda a pezzi:
           "Ist-Temperatur" sparisce tutta, "Luce-stato" diventa "Luce", "Abat-jour" resta. */
        const tenute = parole.slice();
        while (tenute.length) {
            const ultima = tenute[tenute.length - 1];
            if (diRuolo(ultima)) { tenute.pop(); continue; }
            /* ruoli di due parole: "on off", "set point", "dimmer relativo" */
            if (tenute.length > 1 && diRuolo(tenute[tenute.length - 2] + ' ' + ultima)) { tenute.splice(-2, 2); continue; }
            const pezzi = ultima.split(/[-–—]/);
            if (pezzi.length > 1) {
                while (pezzi.length && (!pezzi[pezzi.length - 1] || diRuolo(pezzi[pezzi.length - 1]))) pezzi.pop();
                if (!pezzi.length) { tenute.pop(); continue; }
                tenute[tenute.length - 1] = pezzi.join('-');
            }
            break;
        }
        const n = (tenute.length ? tenute : parole).join(' ').replace(/\s*[-–—:]\s*$/, '').trim();
        return n.charAt(0).toUpperCase() + n.slice(1);
    }
    /* da un indirizzo ETS al campo che gli spetta (le stesse regole che stavano nella dashboard) */
    function ruoloDa(v) {
        const d = v.dpt || '';
        const n = norm((v.name || '') + ' ' + (v.path || ''));
        const nome = norm(v.name || '');
        const stato = /\bstato\b|\bstate\b|\bstatus\b|feedback|ruckmeld|rueckmeld|\brm\b|\bfb\b|\britorno\b/.test(nome.replace(/termostat\w*|thermostat\w*/g, ' '));
        if (d === '1.010' || /\bstop\b|lamell|\bstep\b/.test(nome)) return 'ga_stop';
        if (d === '1.008' || d === '1.009') return 'ga_command';
        if (d === '1.100' || /caldo.?freddo|heat.?cool/.test(nome)) return stato ? 'ga_heat_cool_state' : 'ga_heat_cool';
        if (/^20\./.test(d)) return stato ? 'ga_mode_state' : 'ga_mode';
        if (/^9\./.test(d) || /temperatur/.test(nome)) {
            if (/setpoint|set point|consegna|desiderat|impostat|comfort|sollwert/.test(nome)) return stato ? 'ga_setpoint_state' : 'ga_setpoint';
            return 'ga_temperature';
        }
        if (d === '5.001' || d === '5.004' || /posizion|position|luminosit|brightness|valore|%/.test(nome)) {
            if (/tappar|serrand|tend|venezian|posizion|position|blind|shutter|rollad|persian/.test(n)) return stato ? 'ga_position_state' : 'ga_position';
            return stato ? 'ga_brightness_state' : 'ga_brightness';
        }
        if (d === '1.011' || stato) return 'ga_state';
        return 'ga_command';
    }
    function tipoDa(v, ruolo) {
        if (['ga_stop', 'ga_position', 'ga_position_state'].includes(ruolo)) return 'cover';
        if (/^ga_(temperature|setpoint|heat_cool|mode)/.test(ruolo)) return 'climate';
        if (/^ga_brightness/.test(ruolo)) return 'dimmer';
        const n = norm((v.name || '') + ' ' + (v.path || ''));
        if (/tappar|serrand|tend|venezian|blind|shutter|rollad|persian/.test(n) || v.dpt === '1.008') return 'cover';
        if (/termost|clima|temperatur|riscald|fancoil/.test(n)) return 'climate';
        if (/\bluc[ei]\b|luce|lamp|light|farett|plafon|dimmer|applique|led|lampad/.test(n)) return 'light';
        if (v.domain === 'cover' || v.domain === 'climate' || v.domain === 'light') return v.domain;
        return 'switch';
    }
    /* parto da UN indirizzo: compongo il dispositivo intero con i suoi fratelli (stessa radice, stesso ramo) */
    function componiDa(addr) {
        const v = S.ets.per[addr];
        if (!v) return;
        const ruolo = ruoloDa(v);
        let tipoModulo = tipoDa(v, ruolo);
        const dominio = tipoModulo === 'dimmer' ? 'light' : tipoModulo;
        const r0 = radice(v.name);
        const fratelli = S.ets.voci.filter(x => x.address !== addr && !x.usato_da && !x.usato && radice(x.name) === r0 && r0 && (x.path || '') === (v.path || ''));
        const ind = {}; GA.forEach(k => { ind[k] = ''; });
        const proposti = {};
        const campi = campiDi(dominio);
        if (campi[ruolo]) ind[ruolo] = v.address;
        fratelli.forEach(f => {
            const rr = ruoloDa(f);
            if (campi[rr] && !ind[rr]) { ind[rr] = f.address; proposti[rr] = true; }
        });
        if (dominio === 'light' && (ind.ga_brightness || ind.ga_brightness_state)) tipoModulo = 'dimmer';
        /* se il ruolo dell'indirizzo toccato non esiste per quel tipo, lo si mette nel comando */
        if (!campi[ruolo] && !ind.ga_command && campi.ga_command) ind.ga_command = v.address;
        /* la stanza, se il nome o il ramo ETS la nominano ("Luce cucina on/off" -> Cucina) */
        const testo = ' ' + norm((v.name || '') + ' ' + (v.path || '')).replace(/[^a-z0-9]+/g, ' ') + ' ';
        const stanza = ((S.dati && S.dati.stanze) || []).slice().sort((a, b) => b.length - a.length)
            .find(st => { const n = norm(st).replace(/[^a-z0-9]+/g, ' ').trim(); return n && testo.includes(' ' + n + ' '); }) || '';
        nuovo(tipoModulo, { nome: nomeProposto(v.name) || v.address, indirizzi: ind, stanza }, proposti);
        const n = Object.keys(proposti).length;
        if (n) biscotto('Ho trovato ' + n + (n === 1 ? ' indirizzo fratello' : ' indirizzi fratelli') + ' nel progetto', 'Sono segnati con ETS: controlla che siano giusti.', 'bene', 5200);
    }

    function apriEts() {
        S.cassetto = { modo: 'ets' };
        S.etsQ = ''; S.etsSolo = 'tutti';                  // si parte sempre da pulito
        document.querySelectorAll('.riga.scelta').forEach(r => r.classList.remove('scelta'));
        disegnaEts();
        apriCassetto();
        if (!S.ets.caricato) caricaEts();
    }

            '<div class="passo">' + (S.ets.totale ? '<span data-no-tr>' + S.ets.totale + '</span> <span>indirizzi importati dal progetto</span>' : '<span>Nessun progetto importato</span>') + '</div></div>' +

                 '<div class="filtri" style="margin-top:-8px">' + [['tutti', 'Tutti'], ['liberi', 'Ancora liberi'], ['usati', 'Già usati']].map(f => '<button type="button" class="filtro' + (S.etsSolo === f[0] ? ' su' : '') + '" onclick="KNX.etsSolo(\'' + f[0] + '\')">' + f[1] + '</button>').join('') + '</div>' +

            ? '<button class="btn pericolo" type="button" onclick="KNX.svuotaEts()"><i data-lucide="trash-2"></i><span>Svuota</span></button><span class="spazio"></span><button class="btn" type="button" onclick="KNX.sceglifile()"><i data-lucide="file-up"></i><span>Sostituisci il file</span></button>'
            : '<span class="spazio"></span><button class="btn" type="button" onclick="KNX.chiudi()">Chiudi</button>';
        icone($('cas-testa')); icone($('cas-corpo')); icone($('cas-piede'));
        const dep = $('deposito');
        if (dep) {
            dep.addEventListener('click', e => { e.preventDefault(); $('file-ets').click(); });
            ['dragenter', 'dragover'].forEach(ev => dep.addEventListener(ev, e => { e.preventDefault(); dep.classList.add('sopra'); }));
            ['dragleave', 'drop'].forEach(ev => dep.addEventListener(ev, e => { e.preventDefault(); dep.classList.remove('sopra'); }));
            dep.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) importaEts(f); });
        }
        if (S.ets.totale) disegnaListaEts();
    }
    function disegnaListaEts() {
        const box = $('ets-lista');
        if (!box) return;
        const scelta = S.cassetto && S.cassetto.scegliPer;     // sto scegliendo per un campo?
        /* il selettore di un campo ha la sua ricerca e mostra sempre tutto (anche gli usati) */
        const q = norm((scelta ? S.cassetto.q : S.etsQ) || '');
        const solo = scelta ? 'tutti' : (S.etsSolo || 'tutti');
        let voci = S.ets.voci.filter(v => {
            const usato = v.usato_da || v.usato;
            if (solo === 'liberi' && usato) return false;
            if (solo === 'usati' && !usato) return false;
            if (!q) return true;
            return norm(v.address + ' ' + (v.name || '') + ' ' + (v.path || '') + ' ' + (v.dpt || '')).includes(q);
        });
        let att = null;
        if (scelta) {
            att = (campiDi(S.cassetto.torna.dominio)[scelta] || {}).att;
            voci.sort((a, b) => ((att && b.dpt && att.test(b.dpt)) ? 1 : 0) - ((att && a.dpt && att.test(a.dpt)) ? 1 : 0));
        }
        const tanti = voci.length;
        voci = voci.slice(0, 250);
        if (!tanti) {
            box.innerHTML = '<div class="vuoto piccolo" style="box-shadow:none"><h2>Nessun indirizzo</h2><p>' + (q ? 'Nessun indirizzo per questa ricerca.' : 'Qui non c\'è niente da mostrare.') + '</p>' +
                (q ? '<div class="azioni"><button class="btn" type="button" onclick="KNX.etsTutti()"><i data-lucide="rotate-ccw"></i>Mostra tutti</button></div>' : '') + '</div>';
            icone(box);
            return;
        }
        let h = '<div class="ets-lista">';
        voci.forEach(v => {
            const u = v.usato_da;
            const adatto = att && v.dpt && att.test(v.dpt);
            h += '<button type="button" class="ets-v' + (u || v.usato ? ' usato' : '') + '" data-addr="' + esc(v.address) + '" onclick="KNX.etsTocca(this.dataset.addr)">' +
                '<span class="addr" data-no-tr>' + esc(v.address) + '</span><span class="n"><b data-no-tr>' + esc(v.name || '—') + '</b><small data-no-tr>' +
                esc([v.path, v.dpt ? 'DPT ' + v.dpt : ''].filter(Boolean).join(' · ') || '—') + '</small></span><span class="dx">' +
                (u ? '<span class="etichetta uso" title="Già usato"><span data-no-tr>' + esc(u.nome) + '</span></span>' : (v.usato ? '<span class="etichetta uso">già usato</span>' : '')) +
                (adatto ? '<span class="etichetta adatto">adatto</span>' : '') +
                (!scelta && !u && !v.usato ? '<span class="piu"><i data-lucide="plus"></i></span>' : '') + '</span></button>';
        });
        if (tanti > voci.length) h += '<div class="ets-altro"><span data-no-tr>' + (tanti - voci.length) + '</span> <span>altri: restringi la ricerca</span></div>';
        box.innerHTML = h + '</div>';
        icone(box);
    }
    async function etsTocca(addr) {
        const c = S.cassetto;
        if (c && c.scegliPer) {
            /* torno al modulo con l'indirizzo nel campo */
            const t = c.torna;
            t.valori = t.valoriVivi;
            t.valori.indirizzi[c.scegliPer] = addr;
            if (t.proposti) delete t.proposti[c.scegliPer];
            S.cassetto = t;
            disegnaModulo();
            const inp = $('f-' + c.scegliPer);
            if (inp) { const f = $('facoltativi'); if (f && f.contains(inp)) f.classList.add('aperti'); setTimeout(() => inp.scrollIntoView({ block: 'center' }), 50); }
            fuocoNelCassetto(false);
            salvaBozza();
            return;
        }
        let v = S.ets.per[addr];
        if (v && v.usato_da && !S.perId[v.usato_da.entity_id]) {
            /* l'elenco dice "usato da" un dispositivo che la pagina non conosce (eliminato, o creato da
               un altro tablet): prima si rilegge tutto, poi si decide. Trattarlo come libero porterebbe
               proprio al doppione, se nel frattempo l'indirizzo e' passato a un altro dispositivo. */
            await carica(true);
            await caricaEts();
            if (S.cassetto !== c) return;                  // intanto e' stato chiuso o cambiato
            v = S.ets.per[addr];
            if (!v) return biscotto('Elenco aggiornato', 'Questo indirizzo non c\'è più nel progetto ETS.', 'avviso');
            if (v.usato_da && !S.perId[v.usato_da.entity_id]) return biscotto('Elenco aggiornato', '', 'avviso');
        }
        if (v && v.usato_da) return apri(v.usato_da.entity_id);
        componiDa(addr);
    }
    function scegliEts(k) {
        const c = S.cassetto;
        if (!c || !S.ets.totale) return;
        c.valoriVivi = leggiModulo();
        const quale = campiDi(c.dominio)[k] || { t: k };
        const nome = (c.valoriVivi.nome || '').trim();
        /* la ricerca parte dal nome del dispositivo, ma solo se trova qualcosa: un nome appena
           cambiato ("Luce cucina nuova") non deve lasciare davanti a una lista vuota */
        let q = nome ? radice(nome) : '';
        if (q && !S.ets.voci.some(v => norm(v.address + ' ' + (v.name || '') + ' ' + (v.path || '') + ' ' + (v.dpt || '')).includes(norm(q)))) q = '';
        S.cassetto = { modo: 'scelta', scegliPer: k, torna: c, q };
        $('cas-testa').innerHTML = '<button class="chiudi" type="button" onclick="KNX.tornaModulo()" title="Torna al dispositivo"><i data-lucide="arrow-left"></i></button><div class="t"><h2 id="cas-titolo">' + esc(quale.t) + '</h2>' +
            '<div class="passo"><span>Scegli l\'indirizzo · DPT tipico</span> <span data-no-tr>' + esc(quale.dpt || '') + '</span></div></div>';
        $('cas-corpo').innerHTML = '<label class="ets-cerca"><i data-lucide="search"></i><input type="text" id="ets-q" placeholder="Cerca per nome, ramo o indirizzo" autocomplete="off" spellcheck="false" value="' + esc(q) + '"></label><div id="ets-lista"></div>';
        $('cas-piede').innerHTML = '<button class="btn" type="button" onclick="KNX.tornaModulo()"><i data-lucide="arrow-left"></i><span>Indietro</span></button>';
        icone($('cas-testa')); icone($('cas-corpo')); icone($('cas-piede'));
        disegnaListaEts();
        fuocoNelCassetto(false);
        setTimeout(() => { const i = $('ets-q'); if (i && window.innerWidth > 760) { i.focus(); i.select(); } }, 60);
    }
    function tornaModulo() {
        const c = S.cassetto;
        if (!c || !c.torna) return;
        c.torna.valori = c.torna.valoriVivi;
        S.cassetto = c.torna;
        disegnaModulo();
        fuocoNelCassetto(false);
    }
    async function importaEts(file) {
        if (!file) return;
        if (S.ets.totale) {
            const ok = await chiedi('Gli ' + S.ets.totale + ' indirizzi importati adesso vengono sostituiti da quelli del file «' + file.name + '». I dispositivi già creati non cambiano.', { titolo: 'Sostituire l\'elenco ETS?', si: 'Sostituisci', no: 'Annulla' });
            if (!ok) return;
        }
        const fd = new FormData();
        fd.append('file', file);
        biscotto('Leggo il file…', file.name, 'bene', 1800);
        try {
            const r = await fetch('/api/knx/ets_import', { method: 'POST', body: fd, credentials: 'same-origin' });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || j.status !== 'success') return avvisa(j.message || 'Il file non è stato letto.', { titolo: 'Import non riuscito' });
            S.ets.totale = j.totale || 0;
            await caricaEts();
            biscotto('Importati ' + (j.totale || 0) + ' indirizzi', 'Adesso puoi comporre i dispositivi toccando un indirizzo.', 'bene', 5000);
            if (S.cassetto && S.cassetto.modo === 'ets') { S.etsSolo = 'liberi'; disegnaEts(); }
        } catch (e) { avvisa('Il server non risponde.', { titolo: 'Import non riuscito' }); }
    }
    async function svuotaEts() {
        const ok = await chiedi('Si cancella solo l\'elenco degli indirizzi importati: i dispositivi già creati restano come sono.', { titolo: 'Svuotare l\'elenco ETS?', si: 'Svuota', no: 'Annulla', pericolo: true });
        if (!ok) return;
        try {
            await api('/api/knx/ets_clear', { method: 'POST', corpo: {} });
            S.ets = { voci: [], per: {}, caricato: true, totale: 0 };
            $('bollo-ets').classList.add('nascosto');
            disegnaEts();
            biscotto('Elenco ETS svuotato', '', 'bene');

    }
    $('file-ets').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importaEts(f); });

    document.addEventListener('keydown', e => {
        const scrivendo = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
        const aperto = $('cassetto').classList.contains('su');
        if (e.key === 'Escape') {
            if (document.querySelector('.wh-pop')) return;           // la conferma si chiude da sola
            if (aperto) { e.preventDefault(); if (S.cassetto && S.cassetto.scegliPer) tornaModulo(); else chiudi(); }
            else if (S.q) { q.value = ''; S.q = ''; $('cerca').classList.remove('piena'); disegna(); }
            return;
        }
        if (scrivendo || aperto || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') { e.preventDefault(); q.focus(); q.select(); }
        else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nuovo(); }
        /* la riga si comporta come un pulsante: Invio e Spazio (senza far scorrere la pagina) */
        else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('riga')) { e.preventDefault(); apri(e.target.dataset.id); }
    });

    window.KNX = {
        apri, chiudi, salva, elimina, duplica, prova, leggiBus, scegliEts, tornaModulo, apriEts, svuotaEts,
        /* "Aggiungi" con un modulo modificato aperto: prima si chiede, come per la chiusura */
        nuovo: async () => {
            const c = S.cassetto;
            if (c && c.orig && sporco()) {
                const ok = await chiedi(testoLascia(c), { titolo: 'Chiudere senza salvare?', si: 'Chiudi', no: 'Continua a modificare', icona: 'info' });
                if (!ok) return;
                scriviBozzaOra(c);
            }
            nuovo();
        },
        scegliTipo: t => scegliTipo(t),
        indietroTipo: async () => {
            if (sporco()) {
                const ok = await chiedi('Tornando alla scelta del tipo quello che hai scritto resta in bozza.', { titolo: 'Cambiare tipo?', si: 'Cambia tipo', no: 'Resta qui' });
                if (!ok) return;
                scriviBozzaOra(S.cassetto);
            }
            nuovo();
        },
        etsTocca, etsSolo: s => { S.etsSolo = s; document.querySelectorAll('#cas-corpo .filtro').forEach(b => b.classList.toggle('su', b.getAttribute('onclick').includes("'" + s + "'"))); disegnaListaEts(); },
        /* "Mostra tutti" sotto una ricerca ETS che non trova niente: svuota la casella */
        etsTutti: () => {
            if (S.cassetto && S.cassetto.scegliPer) S.cassetto.q = ''; else S.etsQ = '';
            const i = $('ets-q'); if (i) i.value = '';
            disegnaListaEts();
            if (i && window.innerWidth > 760) i.focus();
        },
        sceglifile: () => $('file-ets').click(),
        salta: id => {
            if (!sporco()) return apri(id);
            chiedi('Le modifiche di questo dispositivo restano in bozza.', { titolo: 'Aprire l\'altro dispositivo?', si: 'Apri', no: 'Resta qui' })
                .then(ok => { if (!ok) return; scriviBozzaOra(S.cassetto); apri(id); });
        },
        /* si riprende la bozza fondendola coi dati di adesso: vedi fondiBozza */
        riprendiBozza: () => {
            const c = S.cassetto;
            if (!c || !c.bozza) return;
            const b = c.bozza;
            const { m, doppi } = fondiBozza(c, b);
            c.valori = m;
            if (b.nomeCliente) c.nomeCliente = b.nomeCliente;
            c.bozza = null;
            disegnaModulo();
            fuocoNelCassetto(false);
            if (c.modo === 'modifica' && !b.base) {
                avvisa('Questa bozza è di una versione precedente della pagina: ricontrolla ogni campo prima di salvare.', { titolo: 'Bozza ripresa' });
            } else if (doppi.length) {
                const campi = campiDi(c.dominio);
                const nomi = { nome: 'Nome', note: 'Note per chi installa', stanza: 'Stanza' };
                /* una riga per campo: si legge meglio e ognuna si traduce da sola */
                avvisa('Nel frattempo qualcuno ha cambiato anche questi campi. Qui c\'è il tuo valore: controlla prima di salvare.\n' +
                    doppi.map(k => '«' + (nomi[k] || (campi[k] || {}).t || k) + '»').join('\n'), { titolo: 'Bozza ripresa' });
            } else biscotto('Bozza ripresa', 'Controlla e salva.', 'bene');
        },
        scartaBozza: () => { const c = S.cassetto; if (!c) return; memo.togli(chiaveBozza()); c.bozza = null; const b = $('bozza'); if (b) b.innerHTML = ''; fuocoNelCassetto(false); },
        apriChiudi: el => {
            const g = el.parentNode;
            g.classList.toggle('chiuso');
            el.setAttribute('aria-expanded', g.classList.contains('chiuso') ? 'false' : 'true');
            const k = S.raggruppa + ':' + g.dataset.chiave;
            if (g.classList.contains('chiuso')) S.chiusi[k] = 1; else delete S.chiusi[k];
            memo.scrivi('knx_chiusi', S.chiusi);
        },
        perTipo: t => { S.tipo = (S.tipo === t) ? '' : t; if (t === '') { S.tipo = ''; S.filtro = ''; } disegna(); },
        perFiltro: f => { S.filtro = (S.filtro === f) ? '' : f; disegna(); },
        azzera: () => { S.q = ''; S.tipo = ''; S.filtro = ''; q.value = ''; $('cerca').classList.remove('piena'); disegna(); },
        pulisciRicerca: () => { q.value = ''; S.q = ''; $('cerca').classList.remove('piena'); disegna(); q.focus(); },
        notte: () => { const si = !document.body.classList.contains('notte'); memo.scrivi('knx_notte', si); applicaNotte(si); },
        ricarica: () => carica(false),
        esci: () => {
            /* si arriva dal pulsante nella card KNX delle integrazioni: si torna li', con la card aperta */
            window.location.href = '/dashboard?integrazione=knx';
        },
    };

    /* =================================================================
       9. PARTENZA: scheletro subito, dati appena arrivano
       ================================================================= */
    (function scheletro() {
        let h = '';
        [4, 3].forEach(n => {
            h += '<section class="gruppo"><div class="gruppo-testa"><span class="ico"></span><span class="scheletro" style="width:140px"></span></div><div class="righe">';
            for (let i = 0; i < n; i++) h += '<div class="riga" style="cursor:default"><div class="piastra" style="--c:var(--fioco-2)"></div><div class="chi"><div class="scheletro" style="width:' + (120 + i * 27 % 90) + 'px"></div><div class="scheletro" style="width:80px;height:10px;margin-top:8px"></div></div><div class="indirizzi"><div class="scheletro" style="width:170px"></div></div><div class="scheletro" style="width:70px;height:26px;border-radius:13px"></div><span></span></div>';
            h += '</div></section>';
        });
        $('elenco').innerHTML = h;
        let t = '';
        for (let i = 0; i < 6; i++) t += '<div class="tessera" style="cursor:default"><span class="icona" style="--c:var(--fioco-2)"></span><div><div class="scheletro" style="width:34px;height:22px"></div><div class="scheletro" style="width:70px;height:10px;margin-top:8px"></div></div></div>';
        $('tessere').innerHTML = t;
    })();
    icone();
    carica(false);
})();
</script>
</body>
</html>
