</div>
<div class="biscotti" id="biscotti" aria-live="polite"></div>

<script>
(function () {
    'use strict';

    /* =================================================================
       1. ATTREZZI
       ================================================================= */
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const icone = el => { if (window.lucide) window.lucide.createIcons({ root: el || document }); };
    /* i testi scritti dal JavaScript passano comunque nel DOM e i18n.js li traduce; tr() serve
       solo dove il testo non finisce in un nodo (titoli, file, appunti). In italiano resta com'e'. */
    const tr = t => { try { return window.WH_T ? window.WH_T(t) : t; } catch (e) { return t; } };
    const memo = {
        leggi(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
        scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    };
    const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const LINGUA = (document.documentElement.lang || 'it').slice(0, 2);
    const LOC = LINGUA === 'it' ? 'it-IT' : LINGUA;
    const nf = new Intl.NumberFormat(LOC);
    const num = n => nf.format(n);
    const due = n => (n < 10 ? '0' : '') + n;
    /* numeri delle misure scritti come arrivano dai sensori (col punto), niente code di virgola mobile */
    const cifra = x => String(Math.round(x * 1000) / 1000);
    const chiaveData = d => d.getFullYear() + '-' + due(d.getMonth() + 1) + '-' + due(d.getDate());
    const oggiChiave = () => chiaveData(new Date());
    const spostaGiorno = (k, n) => { const [y, m, d] = k.split('-').map(Number); return chiaveData(new Date(y, m - 1, d + n)); };
    const dataDaChiave = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

    async function api(url, opzioni) {
        let r;
        try { r = await fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opzioni || {})); }
        catch (e) { throw { tipo: 'rete', message: 'Il server non risponde. Controlla la connessione.' }; }
        if (r.status === 403) throw { tipo: 'permessi', message: 'Il registro lo vede solo un amministratore.' };
        const tipo = r.headers.get('content-type') || '';
        if (!tipo.includes('json')) throw { tipo: 'sessione', message: 'La sessione è scaduta: rientra per continuare.' };
        let j;
        try { j = await r.json(); } catch (e) { throw { tipo: 'server', message: 'Risposta non valida dal server.' }; }
        if (!r.ok) throw { tipo: 'server', message: (j && (j.message || j.error)) || ('Errore del server (' + r.status + ')') };
        return j;
    }

    function biscotto(testo, sotto, tipo, durata) {
        const box = $('biscotti');
        const el = document.createElement('div');
        const ico = { bene: 'circle-check', male: 'circle-alert', avviso: 'triangle-alert' }[tipo || 'bene'] || 'info';
        el.className = 'biscotto ' + (tipo || 'bene');
        el.innerHTML = '<i data-lucide="' + ico + '"></i><div><span></span>' + (sotto ? '<small></small>' : '') + '</div>';
        el.querySelector('span').textContent = testo;
        if (sotto) el.querySelector('small').textContent = sotto;
        box.appendChild(el);
        icone(el);
        while (box.children.length > 3) box.firstChild.remove();
        setTimeout(() => { el.classList.add('via'); setTimeout(() => el.remove(), 260); }, durata || 3200);
    }

    function quandoFa(ms) {
        const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
        if (s < 10) return 'adesso';
        if (s < 60) return s + ' s fa';
        if (s < 3600) return Math.floor(s / 60) + ' min fa';
        if (s < 86400) return Math.floor(s / 3600) + ' h fa';
        return Math.floor(s / 86400) + ' g fa';
    }
    function durata(ms) {
        const s = Math.max(0, Math.round(ms / 1000));
        if (s < 60) return s + ' s';
        const m = Math.floor(s / 60);
        if (m < 60) return m + ' min';
        const h = Math.floor(m / 60);
        if (h < 24) return h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
        const g = Math.floor(h / 24);
        return g + ' g' + (h % 24 ? ' ' + (h % 24) + ' h' : '');
    }

    /* =================================================================
       2. CHE COSA DICE UN EVENTO
       Nel registro arrivano solo tre cose: quando, quale entita', il nuovo stato
       (vedi log_event in app.py). Livello e fonte si ricavano da li'.
       ================================================================= */
    const LIVELLI = {
        acceso:   { nome: 'Accensioni',  breve: 'Acceso',      icona: 'power',          c: 'var(--verde)' },
        spento:   { nome: 'Spegnimenti', breve: 'Spento',      icona: 'power-off',      c: 'var(--fioco)' },
        misura:   { nome: 'Misure',      breve: 'Misura',      icona: 'gauge',          c: 'var(--accento)' },
        stato:    { nome: 'Altri stati', breve: 'Stato',       icona: 'shuffle',        c: 'var(--viola)' },
        anomalia: { nome: 'Anomalie',    breve: 'Anomalia',    icona: 'triangle-alert', c: 'var(--ambra)' },
    };
    const ORDINE_LIV = ['acceso', 'spento', 'misura', 'stato', 'anomalia'];
    /* stessi insiemi di normalize_state() in app.py: e' cosi' che il motore decide se loggare */
    const ACCESI = new Set(['on', 'open', 'true', '1', 'playing', 'streaming']);
    const SPENTI = new Set(['off', 'closed', 'false', '0', 'paused', 'idle', 'stopped', 'standby']);
    const ANOMALI = new Set(['unavailable', 'unknown', 'none', 'null', 'offline', 'sconosciuto', 'error', 'errore', 'fault', 'problem', 'jammed', 'triggered']);
    const GRAVI = new Set(['error', 'errore', 'fault', 'problem', 'jammed', 'triggered']);

    const FAMIGLIE = {
        light:         { nome: 'Luci',          icona: 'lightbulb',    c: 'var(--c-light)' },
        switch:        { nome: 'Interruttori',  icona: 'toggle-right', c: 'var(--c-switch)' },
        input_boolean: { nome: 'Interruttori',  icona: 'toggle-right', c: 'var(--c-switch)', come: 'switch' },
        cover:         { nome: 'Tapparelle',    icona: 'blinds',       c: 'var(--c-cover)' },
        climate:       { nome: 'Clima',         icona: 'thermometer',  c: 'var(--c-climate)' },
        water_heater:  { nome: 'Clima',         icona: 'thermometer',  c: 'var(--c-climate)', come: 'climate' },
        fan:           { nome: 'Clima',         icona: 'fan',          c: 'var(--c-climate)', come: 'climate' },
        sensor:        { nome: 'Sensori',       icona: 'gauge',        c: 'var(--c-sensor)' },
        binary_sensor: { nome: 'Rilevatori',    icona: 'radio',        c: 'var(--c-binary)' },
        media_player:  { nome: 'Multimedia',    icona: 'speaker',      c: 'var(--c-media)' },
        camera:        { nome: 'Telecamere',    icona: 'cctv',         c: 'var(--c-camera)' },
        group:         { nome: 'Gruppi',        icona: 'layers',       c: 'var(--c-group)' },
        scene:         { nome: 'Scene',         icona: 'sparkles',     c: 'var(--c-scene)' },
        script:        { nome: 'Scene',         icona: 'sparkles',     c: 'var(--c-scene)', come: 'scene' },
        automation:    { nome: 'Scene',         icona: 'sparkles',     c: 'var(--c-scene)', come: 'scene' },
        alarm_control_panel: { nome: 'Allarme', icona: 'siren',       c: 'var(--c-alarm)' },
        lock:          { nome: 'Allarme',       icona: 'siren',        c: 'var(--c-alarm)', come: 'alarm_control_panel' },
    };
    const ORDINE_FAM = ['light', 'switch', 'cover', 'climate', 'sensor', 'binary_sensor', 'media_player', 'camera', 'group', 'scene', 'alarm_control_panel', 'altro'];
    const ALTRO = { nome: 'Altro', icona: 'cpu', c: 'var(--c-altro)' };
    const famiglia = dom => { const f = FAMIGLIE[dom]; return f ? (f.come || dom) : 'altro'; };
    const famigliaInfo = k => (k === 'altro' ? ALTRO : FAMIGLIE[k]) || ALTRO;

    function livelloDi(dom, s) {
        if (ANOMALI.has(s)) return 'anomalia';
        const n = s !== '' && isFinite(Number(s));
        if (dom === 'sensor') return n ? 'misura' : 'stato';
        if (ACCESI.has(s)) return 'acceso';
        if (SPENTI.has(s)) return 'spento';
        return n ? 'misura' : 'stato';
    }
    /* come si chiama quel cambio per quel tipo di dispositivo (la luce si accende, la tapparella si apre) */
    const PAROLE = {
        'light:acceso': 'Accesa', 'light:spento': 'Spenta',
        'cover:acceso': 'Aperta', 'cover:spento': 'Chiusa',
        'binary_sensor:acceso': 'Rilevato', 'binary_sensor:spento': 'A riposo',
        'media_player:acceso': 'In riproduzione',
    };
    const STATI = {
        paused: 'In pausa', idle: 'Inattivo', stopped: 'Fermo', standby: 'In attesa',
        heat: 'Riscalda', cool: 'Raffresca', heat_cool: 'Automatico', auto: 'Automatico', dry: 'Deumidifica', fan_only: 'Solo ventola',
        opening: 'In apertura', closing: 'In chiusura', locked: 'Chiusa a chiave', unlocked: 'Aperta',
        armed_away: 'Inserito', armed_home: 'Inserito in casa', armed_night: 'Inserito notte', disarmed: 'Disinserito', arming: 'In inserimento', pending: 'In attesa',
        home: 'In casa', not_home: 'Fuori casa', dentro: 'Dentro', fuori: 'Fuori',
        unavailable: 'Non disponibile', unknown: 'Sconosciuto', offline: 'Non raggiungibile', none: 'Sconosciuto', null: 'Sconosciuto', sconosciuto: 'Sconosciuto',
        error: 'Errore', errore: 'Errore', fault: 'Guasto', problem: 'Problema', jammed: 'Bloccata', triggered: 'Allarme scattato',
    };
    function parolaDi(ev) {
        if (ev.liv === 'misura') return 'Misura';
        return STATI[ev.s] || PAROLE[ev.dom + ':' + ev.liv] || (ev.liv === 'stato' ? 'Cambio di stato' : LIVELLI[ev.liv].breve);
    }

    /* da dove viene l'entita' (lo dice il suo id: vedi i get_*_entities in app.py) */
    function integrazioneDi(eid) {
        let m = eid.match(/___wach(\d+)$/);
        if (m) return 'Hub remoto ' + m[1];
        m = eid.match(/___ha(\d+)$/);
        if (m) return 'Home Assistant ' + m[1];
        if (eid.startsWith('media_player.tv_')) return 'Smart TV';
        if (eid.includes('.knx_')) return 'KNX';
        if (eid.includes('.virtual_')) return 'Entità virtuale';
        if (eid.includes('.sonos_')) return 'Sonos';
        if (eid.includes('.shelly_')) return 'Shelly';
        if (eid.includes('.tapo_')) return 'Tapo';
        return '';
    }
    function nomeDaId(eid) {
        const base = eid.split('___')[0];
        let p = base.includes('.') ? base.slice(base.indexOf('.') + 1) : base;
        const senza = p.replace(/^(knx|virtual|shelly|sonos|tapo|tv)_/, '');
        p = (/^\d+$/.test(senza) ? p : senza).replace(/_/g, ' ').trim();          // 'tapo_2' resta 'Tapo 2', non '2'
        if (/^tv \d+$/i.test(p)) p = 'TV ' + p.slice(3);
        return p ? p.charAt(0).toUpperCase() + p.slice(1) : eid;
    }

    /* =================================================================
       3. STATO DELLA PAGINA
       ================================================================= */
    const PASSO = 2000;            // eventi per pagina
    const S = {
        ev: [],                    // eventi, dal piu' vecchio al piu' nuovo
        vis: [],                   // quelli che passano i filtri
        nomi: {},                  // entity_id -> nome dato dal cliente
        conId: null,               // il server manda id/ts (API nuova)? null = non ancora saputo
        limite: PASSO,
        forsePiu: false,           // il server ne ha altri piu' vecchi
        periodo: memo.leggi('monitor_periodo', 'tutto'),
        da: memo.leggi('monitor_da', ''), a: memo.leggi('monitor_a', ''),
        q: '', parole: [], liv: '', fam: '', entita: '',
        vivo: true,                // aggiornamento dal vivo acceso
        rete: true,                // l'ultimo giro col server e' andato bene
        segui: true,               // la vista sta in fondo e segue i nuovi
        nuovi: 0,
        aperti: new Map(),         // n evento -> altezza misurata del dettaglio aperto
        caricando: false, prime: true, errore: null,
        seq: 0,
    };

    /* =================================================================
       4. DAL SERVER
       ================================================================= */
    function intervallo() {
        const oggi = oggiChiave();
        if (S.periodo === 'oggi') return { da: oggi, a: oggi };
        if (S.periodo === '7') return { da: spostaGiorno(oggi, -6), a: oggi };
        if (S.periodo === '30') return { da: spostaGiorno(oggi, -29), a: oggi };
        if (S.periodo === 'scelto' && (S.da || S.a)) return { da: S.da || '', a: S.a || '' };
        return { da: '', a: '' };
    }
    /* il periodo arriva fino a oggi? allora ha senso restare in ascolto */
    const periodoVivo = () => { const r = intervallo(); return !r.a || r.a >= oggiChiave(); };

    function urlLog(extra) {
        const p = new URLSearchParams();
        const r = intervallo();
        /* Il server vecchio confronta le date con l'ora UTC del database: si chiede un giorno in
           piu' per parte e si ritaglia qui, sull'ora di casa. Con l'API nuova non serve. */
        if (r.da) p.set('date_from', S.conId ? r.da : spostaGiorno(r.da, -1));
        if (r.a) p.set('date_to', S.conId ? r.a : spostaGiorno(r.a, 1));
        Object.keys(extra || {}).forEach(k => p.set(k, extra[k]));
        return '/api/logs?' + p.toString();
    }

    function leggiRiga(r) {
        const t = String(r.timestamp || '');
        const m = t.match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})$/);
        if (!m) return null;
        const eid = String(r.entity_id || '');
        const st = r.state == null ? '' : String(r.state);
        const dom = eid.includes('.') ? eid.split('.')[0] : '';
        const s = st.trim().toLowerCase();
        const ev = {
            n: ++S.seq, id: (typeof r.id === 'number') ? r.id : null,
            raw: t, d: m[3] + '-' + m[2] + '-' + m[1], ora: m[4] + ':' + m[5], sec: m[6],
            ms: (typeof r.ts === 'number') ? r.ts * 1000 : new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5], +m[6]).getTime(),
            eid, st, s, dom, fam: famiglia(dom), p: null, k: null, nuovo: 0,
        };
        ev.liv = livelloDi(dom, s);
        ev.grave = GRAVI.has(s);
        ev.num = ev.liv === 'misura' ? Number(s) : NaN;
        return ev;
    }
    const chiaveEv = ev => ev.raw + '|' + ev.eid + '|' + ev.st;
    function dentroPeriodo(ev) { const r = intervallo(); return (!r.da || ev.d >= r.da) && (!r.a || ev.d <= r.a); }

    /* collega ogni evento al precedente della stessa entita' (per durate, differenze e storia) */
    function collega() {
        const ultimo = new Map();
        for (const ev of S.ev) { ev.p = ultimo.get(ev.eid) || null; ultimo.set(ev.eid, ev); }
    }

    async function carica(opz) {
        opz = opz || {};
        if (S.caricando) return;
        S.caricando = true;
        if (!opz.mantieni) { S.aperti.clear(); mostraCaricamento(); }
        try {
            const righe = await api(urlLog({ limit: S.limite }));
            if (!Array.isArray(righe)) throw { tipo: 'server', message: 'Risposta non valida dal server.' };
            if (righe.length) S.conId = typeof righe[0].id === 'number';
            const prima = V.altezzaTotale;
            const evs = [];
            for (let i = righe.length - 1; i >= 0; i--) { const ev = leggiRiga(righe[i]); if (ev && dentroPeriodo(ev)) evs.push(ev); }
            S.ev = evs;
            S.forsePiu = righe.length >= S.limite;
            S.errore = null; S.rete = true;
            collega();
            ricalcola();
            if (opz.mantieni && !S.segui) V.scorriDi(V.altezzaTotale - prima);        // i piu' vecchi arrivano sopra: la vista resta ferma
            else vaiInFondo();
            if (S.prime) { S.prime = false; caricaNomi(); }
            else if (!Object.keys(S.nomi).length) caricaNomi();
        } catch (e) {
            S.errore = e; S.rete = false;
            if (!S.ev.length || !opz.mantieni) { S.ev = []; ricalcola(); }
            else biscotto(e.message || 'Errore', '', 'male');
        } finally {
            S.caricando = false;
            aggiornaVivo();
        }
    }

    /* nomi dati dal cliente: arrivano dopo (la lista tocca anche Home Assistant e gli hub) */
    async function caricaNomi() {
        try {
            const l = await api('/api/entities_for_automations');
            const nomi = {};
            (Array.isArray(l) ? l : []).forEach(e => { if (e && e.entity_id) nomi[e.entity_id] = String(e.name || '').replace(/^🎬\s*/, ''); });
            S.nomi = nomi;
            S.ev.forEach(ev => { ev.k = null; });
            ricalcola();
        } catch (e) { /* senza nomi si leggono gli id: il registro funziona lo stesso */ }
    }
    const nomeDi = eid => S.nomi[eid] || nomeDaId(eid);

    /* gli eventi piu' vecchi: con l'API nuova si chiede solo il pezzo che manca */
    async function piuVecchi() {
        if (S.caricando) return;
        const bottone = document.querySelector('.piu button');
        if (bottone) { bottone.disabled = true; bottone.innerHTML = '<span class="giro"></span>Carico…'; }
        if (S.conId && S.ev.length && S.ev[0].id != null) {
            S.caricando = true;
            try {
                const righe = await api(urlLog({ limit: PASSO, prima: S.ev[0].id }));
                const prima = V.altezzaTotale;
                const evs = [];
                for (let i = righe.length - 1; i >= 0; i--) { const ev = leggiRiga(righe[i]); if (ev && dentroPeriodo(ev) && ev.id < S.ev[0].id) evs.push(ev); }
                S.ev = evs.concat(S.ev);
                S.limite += PASSO;
                S.forsePiu = righe.length >= PASSO;
                collega();
                ricalcola();
                V.scorriDi(V.altezzaTotale - prima);
            } catch (e) { biscotto(e.message || 'Errore', '', 'male'); V.disegna(true); }
            finally { S.caricando = false; }
        } else {
            S.limite += PASSO;
            S.segui = false;
            await carica({ mantieni: true });
        }
    }

    /* il giro dal vivo: solo i nuovi. Il motore scrive al massimo un giro ogni 3 secondi. */
    let giroInCorso = false, erroriDiFila = 0;
    async function giro() {
        /* primo caricamento fallito (server spento, rete): si riprova da soli, senza schermate che lampeggiano */
        if (S.errore && !S.ev.length) {
            if (S.vivo && !document.hidden && !S.caricando && S.errore.tipo !== 'sessione' && S.errore.tipo !== 'permessi') await carica({ mantieni: true });
            return;
        }
        if (!S.vivo || !periodoVivo() || document.hidden || S.caricando || giroInCorso || S.prime) return;
        giroInCorso = true;
        try {
            const ultimo = S.ev[S.ev.length - 1];
            const extra = { limit: 300 };
            if (S.conId && ultimo && ultimo.id != null) extra.dopo = ultimo.id;
            const righe = await api(urlLog(extra));
            if (!Array.isArray(righe)) throw { tipo: 'server', message: 'Risposta non valida dal server.' };
            if (righe.length && S.conId === null) S.conId = typeof righe[0].id === 'number';
            let nuove = [];
            if (!ultimo) {
                nuove = righe.slice().reverse();
            } else if (S.conId && ultimo.id != null) {
                nuove = righe.filter(r => r.id > ultimo.id).reverse();
            } else {
                /* API vecchia: si cerca nella risposta l'ultimo evento che abbiamo gia'. Gli eventi dello
                   stesso secondo (una scena che accende dieci luci) il server li puo' mettere in un ordine
                   qualsiasi: di quel secondo sono nuovi solo quelli che non abbiamo ancora. */
                const k = chiaveEv(ultimo);
                const chiaveR = r => r.timestamp + '|' + r.entity_id + '|' + r.state;
                const idx = righe.findIndex(r => chiaveR(r) === k);
                if (idx >= 0) {
                    const gia = new Map();
                    for (let i = S.ev.length - 1; i >= 0 && S.ev[i].raw === ultimo.raw; i--) { const c = chiaveEv(S.ev[i]); gia.set(c, (gia.get(c) || 0) + 1); }
                    for (let i = 0; i < righe.length; i++) {
                        const r = righe[i];
                        if (i > idx && r.timestamp !== ultimo.raw) break;
                        if (r.timestamp === ultimo.raw) {
                            const c = chiaveR(r), g = gia.get(c) || 0;
                            if (g) { gia.set(c, g - 1); continue; }
                        }
                        nuove.push(r);
                    }
                    nuove.reverse();
                } else {
                    /* troppi nuovi in 3 secondi, o il registro e' stato svuotato altrove: si ricarica */
                    giroInCorso = false;
                    if (righe.length || S.ev.length) await carica({ mantieni: true });
                    erroriDiFila = 0; S.rete = true; aggiornaVivo();
                    return;
                }
            }
            if (!S.rete) { S.rete = true; if (erroriDiFila > 1) biscotto('Di nuovo collegato', '', 'bene'); }
            erroriDiFila = 0;
            if (nuove.length) aggiungi(nuove);
            aggiornaVivo();
        } catch (e) {
            erroriDiFila++;
            if (e && e.tipo === 'sessione') { S.vivo = false; biscotto('La sessione è scaduta', 'Ricarica la pagina per rientrare.', 'avviso', 6000); }
            if (S.rete && erroriDiFila > 1) S.rete = false;
            aggiornaVivo();
        } finally { giroInCorso = false; }
    }

    function aggiungi(righe) {
        const ultimoPer = new Map();
        for (let i = S.ev.length - 1; i >= 0 && ultimoPer.size < 5000; i--) { const e = S.ev[i]; if (!ultimoPer.has(e.eid)) ultimoPer.set(e.eid, e); }
        const adesso = performance.now();
        let visibiliNuovi = 0;
        for (const r of righe) {
            const ev = leggiRiga(r);
            if (!ev || !dentroPeriodo(ev)) continue;
            ev.p = ultimoPer.get(ev.eid) || null;
            ultimoPer.set(ev.eid, ev);
            ev.nuovo = adesso;
            S.ev.push(ev);
            if (passa(ev)) visibiliNuovi++;
        }
        /* una sessione lasciata aperta giorni non deve crescere senza fine */
        const tetto = S.limite + 5000;
        if (S.ev.length > tetto) { S.ev.splice(0, S.ev.length - tetto); S.ev[0].p = null; S.forsePiu = true; }
        const eraInFondo = S.segui;
        ricalcola(true);
        if (eraInFondo) vaiInFondo();
        else if (visibiliNuovi) { S.nuovi += visibiliNuovi; aggiornaTorna(); }
    }

    /* =================================================================
       5. FILTRI E CONTEGGI
       ================================================================= */
    function testoRicerca(ev) {
        if (ev.k == null) ev.k = norm(nomeDi(ev.eid) + ' ' + ev.eid + ' ' + ev.st + ' ' + tr(parolaDi(ev)) + ' ' + integrazioneDi(ev.eid));
        return ev.k;
    }
    function passaTesto(ev) {
        if (S.entita && ev.eid !== S.entita) return false;
        if (!S.parole.length) return true;
        const t = testoRicerca(ev);
        for (const p of S.parole) if (!t.includes(p)) return false;
        return true;
    }
    const passa = ev => passaTesto(ev) && (!S.liv || ev.liv === S.liv) && (!S.fam || ev.fam === S.fam);

    const conti = { liv: {}, fam: {}, totLiv: 0 };
    function ricalcola(morbido) {
        const cl = {}, cf = {};
        ORDINE_LIV.forEach(k => cl[k] = 0);
        const vis = [];
        let totLiv = 0;
        for (const ev of S.ev) {
            if (!passaTesto(ev)) continue;
            const okL = !S.liv || ev.liv === S.liv, okF = !S.fam || ev.fam === S.fam;
            if (okF) { cl[ev.liv]++; totLiv++; }
            if (okL) cf[ev.fam] = (cf[ev.fam] || 0) + 1;
            if (okL && okF) vis.push(ev);
        }
        conti.liv = cl; conti.fam = cf; conti.totLiv = totLiv;
        S.vis = vis;
        disegnaTessere();
        disegnaFiltri();
        disegnaGrafico();
        disegnaTesta();
        V.costruisci(morbido);
        disegnaStato();
    }

    /* =================================================================
       6. RIEPILOGO: tessere, fonti, grafico, testata
       ================================================================= */
    /* Le tessere si costruiscono una volta sola, poi si aggiornano al loro posto: rifarle a ogni
       giro dal vivo toglieva il fuoco della tastiera e faceva sobbalzare quella sotto il mouse. */
    function disegnaTessere() {
        const box = $('tessere');
        const tot = conti.totLiv;
        if (!box.children.length) {
            let h = tessera('', 'Tutti gli eventi', 'list', 'var(--accento)');
            ORDINE_LIV.forEach(k => { const L = LIVELLI[k]; h += tessera(k, L.nome, L.icona, L.c); });
            box.innerHTML = h;
            icone(box);
        }
        box.querySelectorAll('.tessera').forEach(b => {
            const k = b.dataset.k, n = k ? (conti.liv[k] || 0) : tot;
            const attiva = k ? S.liv === k : !S.liv;
            b.classList.toggle('attiva', attiva);
            b.classList.toggle('vuota', !n);
            b.setAttribute('aria-pressed', attiva);
            b.disabled = !!(!n && !attiva && k);
            const c = b.querySelector('.cifra'), testo = num(n);
            if (c.textContent !== testo) c.textContent = testo;
            const q = b.querySelector('.quota i');
            if (q) q.style.width = (tot ? Math.round(n / tot * 100) : 0) + '%';
        });
    }
    function tessera(k, nome, icona, c) {
        return '<button type="button" class="tessera' + (k === 'anomalia' ? ' allarme' : '') + '" data-k="' + k + '" style="--c:' + c + '" onclick="MON.perLivello(\'' + k + '\')">' +
            '<span class="icona"><i data-lucide="' + icona + '"></i></span>' +
            '<span class="t"><span class="cifra" data-no-tr></span><span class="nome">' + esc(nome) + '</span></span>' +
            (k ? '<span class="quota"><i style="width:0%"></i></span>' : '') + '</button>';
    }

    function disegnaFiltri() {
        const fl = $('filtri');
        const presenti = new Set(S.ev.map(e => e.fam));
        const chiavi = ORDINE_FAM.filter(k => presenti.has(k) || S.fam === k);
        /* stessi pulsanti di prima (succede a ogni giro dal vivo): si aggiornano solo i numeri */
        const firma = (S.entita ? S.entita + '|' + nomeDi(S.entita) : '') + '#' + chiavi.join(',');
        if (fl.dataset.firma === firma) {
            fl.querySelectorAll('.filtro[data-k]').forEach(b => {
                const k = b.dataset.k, n = k ? (conti.fam[k] || 0) : Object.values(conti.fam).reduce((a, x) => a + x, 0);
                b.classList.toggle('su', S.fam === k);
                if (k) b.classList.toggle('zero', !n);
                const el = b.querySelector('.n'), testo = num(n);
                if (el.textContent !== testo) el.textContent = testo;
            });
        } else {
            fl.dataset.firma = firma;
            fl.innerHTML = htmlFiltri(chiavi);
            icone(fl);
        }
        fl.classList.toggle('lunghi', fl.scrollWidth > fl.clientWidth + 2 && fl.scrollLeft + fl.clientWidth < fl.scrollWidth - 4);
        const filtrato = S.q || S.liv || S.fam || S.entita;
        $('azzera').classList.toggle('nascosto', !filtrato);
        $('conteggio').innerHTML = filtrato
            ? '<b data-no-tr>' + num(S.vis.length) + '</b><span data-no-tr> / ' + num(S.ev.length) + '</span>'
            : '<b data-no-tr>' + num(S.ev.length) + '</b> <span>' + (S.ev.length === 1 ? 'evento' : 'eventi') + '</span>';
        $('trovati').textContent = S.q ? num(S.vis.length) : '';
    }
    function htmlFiltri(chiavi) {
        let h = '';
        if (S.entita) {
            h += '<button type="button" class="filtro entita" onclick="MON.soloEntita(\'\')" title="Mostra tutti i dispositivi"><i data-lucide="crosshair"></i>' +
                '<span data-no-tr>' + esc(nomeDi(S.entita)) + '</span><span class="via"><i data-lucide="x"></i></span></button>';
        }
        const tutte = Object.values(conti.fam).reduce((a, b) => a + b, 0);
        h += '<button type="button" class="filtro' + (!S.fam ? ' su' : '') + '" data-k="" onclick="MON.perFamiglia(\'\')"><i data-lucide="layers"></i>Tutte le fonti <span class="n" data-no-tr>' + num(tutte) + '</span></button>';
        chiavi.forEach(k => {
            const F = famigliaInfo(k), n = conti.fam[k] || 0;
            h += '<button type="button" class="filtro' + (S.fam === k ? ' su' : '') + (!n ? ' zero' : '') + '" data-k="' + k + '" style="--c:' + F.c + '" onclick="MON.perFamiglia(\'' + k + '\')">' +
                '<i data-lucide="' + F.icona + '"></i>' + esc(F.nome) + ' <span class="n" data-no-tr>' + num(n) + '</span></button>';
        });
        return h;
    }

    /* GRAFICO: quanti eventi per fascia di tempo (una sola serie, niente legenda) */
    const FASCE = [5 * 60e3, 10 * 60e3, 15 * 60e3, 30 * 60e3, 3600e3, 3 * 3600e3, 6 * 3600e3, 12 * 3600e3, 86400e3, 7 * 86400e3];
    let G = null, sopraI = -1;
    function disegnaGrafico() {
        const box = $('barre');
        const vis = S.vis;
        const adesso = Date.now();
        const r = intervallo();
        let inizio, fine;
        if (S.periodo === 'oggi') { inizio = dataDaChiave(oggiChiave()).getTime(); fine = inizio + 86400e3; }
        else if (r.da) { inizio = dataDaChiave(r.da).getTime(); fine = r.a ? dataDaChiave(r.a).getTime() + 86400e3 : adesso; }
        else if (vis.length) { inizio = vis[0].ms; fine = Math.max(adesso, vis[vis.length - 1].ms + 1); }
        else { inizio = adesso - 86400e3; fine = adesso; }
        if (fine - inizio < 2 * 3600e3) inizio = fine - 2 * 3600e3;
        let passo = FASCE.find(f => (fine - inizio) / f <= 72) || FASCE[FASCE.length - 1];
        /* le fasce partono dall'ora (o dal giorno) intera, nell'ora di casa */
        const d0 = new Date(inizio);
        if (passo >= 86400e3) d0.setHours(0, 0, 0, 0);
        else if (passo >= 3600e3) d0.setHours(Math.floor(d0.getHours() / (passo / 3600e3)) * (passo / 3600e3), 0, 0, 0);
        else d0.setMinutes(Math.floor(d0.getMinutes() / (passo / 60e3)) * (passo / 60e3), 0, 0);
        inizio = d0.getTime();
        const nb = Math.max(1, Math.ceil((fine - inizio) / passo));
        const conta = new Array(nb).fill(0), perLiv = [];
        for (let i = 0; i < nb; i++) perLiv.push({});
        for (const ev of vis) {
            const i = Math.floor((ev.ms - inizio) / passo);
            if (i < 0 || i >= nb) continue;
            conta[i]++;
            perLiv[i][ev.liv] = (perLiv[i][ev.liv] || 0) + 1;
        }
        const max = Math.max(1, ...conta);
        let h = '';
        for (let i = 0; i < nb; i++) {
            const futuro = inizio + i * passo > adesso;
            const cls = 'b' + (!conta[i] ? ' zero' : '') + (futuro ? ' futuro' : '');
            h += '<div class="' + cls + '" data-i="' + i + '"><i style="height:' + (conta[i] ? Math.max(6, conta[i] / max * 100) : 0) + '%"></i></div>';
        }
        box.innerHTML = h + '<span class="base"></span>';
        G = { inizio, passo, nb, conta, perLiv };
        const unita = { 300e3: 'eventi ogni 5 minuti', 600e3: 'eventi ogni 10 minuti', 900e3: 'eventi ogni 15 minuti', 1800e3: 'eventi ogni 30 minuti', 3600e3: 'eventi per ora', 10800e3: 'eventi ogni 3 ore', 21600e3: 'eventi ogni 6 ore', 43200e3: 'eventi ogni 12 ore', 86400e3: 'eventi per giorno', 604800e3: 'eventi per settimana' }[passo];
        $('g-unita').textContent = unita;
        const fmt = (t, soloGiorno) => {
            const d = new Date(t);
            const hm = due(d.getHours()) + ':' + due(d.getMinutes());
            if (passo < 86400e3 && (fine - inizio) <= 86400e3 + 1) return hm;
            if (soloGiorno) return d.toLocaleDateString(LOC, { day: 'numeric', month: 'short' });
            return d.toLocaleDateString(LOC, { day: 'numeric', month: 'short' }) + (passo < 86400e3 ? ' ' + hm : '');
        };
        /* etichette sui confini delle fasce; su piu' giorni basta la data */
        const giorni = (fine - inizio) > 2 * 86400e3;
        /* l'ultima etichetta e' la fine vera (adesso, o la fine dell'ultimo giorno): non il confine
           della fascia, che su piu' giorni leggeva la data di domani */
        const fineAsse = Math.min(inizio + nb * passo, fine);
        $('assi').innerHTML = [inizio, inizio + Math.floor(nb / 2) * passo, giorni ? fineAsse - 1 : fineAsse].map(t => '<span>' + esc(fmt(t, giorni)) + '</span>').join('');
        let ultimaOra = 0;
        for (let i = vis.length - 1; i >= 0 && vis[i].ms > adesso - 3600e3; i--) ultimaOra++;
        $('g-ora').textContent = num(ultimaOra);
        const ip = conta.indexOf(Math.max(...conta));
        $('g-picco').textContent = conta[ip] ? num(conta[ip]) : '–';
        $('picco').title = conta[ip] ? fasciaTesto(ip) : '';
        /* il dispositivo con piu' eventi fra quelli che si vedono */
        const perEnt = new Map();
        let primo = '', volte = 0;
        for (const ev of vis) { const n = (perEnt.get(ev.eid) || 0) + 1; perEnt.set(ev.eid, n); if (n > volte) { volte = n; primo = ev.eid; } }
        const bp = $('g-primo');
        bp.classList.toggle('nascosto', volte < 2 || S.entita === primo);
        bp.dataset.eid = primo;
        $('g-primo-nome').textContent = primo ? nomeDi(primo) : '';
        $('g-primo-n').textContent = primo ? num(volte) : '';
        if (sopraI >= 0 && box.children[sopraI]) box.children[sopraI].classList.add('sopra');
    }
    function fasciaTesto(i) {
        const a = new Date(G.inizio + i * G.passo), b = new Date(G.inizio + (i + 1) * G.passo);
        const giorno = a.toLocaleDateString(LOC, { weekday: 'short', day: 'numeric', month: 'short' });
        if (G.passo >= 86400e3) return G.passo === 86400e3 ? giorno : giorno + ' – ' + new Date(b - 1).toLocaleDateString(LOC, { day: 'numeric', month: 'short' });
        return giorno + ', ' + due(a.getHours()) + ':' + due(a.getMinutes()) + '–' + due(b.getHours()) + ':' + due(b.getMinutes());
    }
    (function grafico() {
        const box = $('barre'), sugg = $('sugg');
        let sopra = null;
        const fascia = e => {
            if (!G) return -1;
            const rc = box.getBoundingClientRect();
            return Math.min(G.nb - 1, Math.max(0, Math.floor((e.clientX - rc.left) / rc.width * G.nb)));
        };
        box.addEventListener('mousemove', e => {
            const i = fascia(e);
            if (i < 0) return;
            box.querySelectorAll('.sopra').forEach(x => { if (x !== box.children[i]) x.classList.remove('sopra'); });
            sopra = box.children[i]; sopraI = i; if (sopra) sopra.classList.add('sopra');
            let righe = '';
            ORDINE_LIV.forEach(k => { const n = G.perLiv[i][k]; if (n) righe += '<div class="r"><i style="background:' + LIVELLI[k].c + '"></i>' + esc(LIVELLI[k].nome) + '<span data-no-tr>' + num(n) + '</span></div>'; });
            sugg.innerHTML = '<b data-no-tr>' + esc(fasciaTesto(i)) + '</b>' +
                (G.conta[i] ? righe + '<small>Tocca per andare a questi eventi</small>' : '<div class="r">Nessun evento</div>');
            const rg = $('grafico').getBoundingClientRect(), rb = box.children[i].getBoundingClientRect();
            let x = rb.left + rb.width / 2 - rg.left;
            x = Math.max(110, Math.min(rg.width - 110, x));
            sugg.style.left = x + 'px'; sugg.style.top = (box.offsetTop) + 'px';
            sugg.classList.add('su');
        });
        box.addEventListener('mouseleave', () => { sugg.classList.remove('su'); box.querySelectorAll('.sopra').forEach(b => b.classList.remove('sopra')); sopra = null; sopraI = -1; });
        box.addEventListener('click', e => {
            const i = fascia(e);
            if (i < 0 || !G.conta[i]) return;
            const t0 = G.inizio + i * G.passo;
            const idx = V.voci.findIndex(v => v.t === 'e' && v.ev.ms >= t0);
            if (idx >= 0) { V.vaiA(idx); sugg.classList.remove('su'); }
        });
    })();

    function disegnaTesta() {
        const ultimo = S.ev[S.ev.length - 1];
        /* un pezzo per nodo: i18n.js traduce ogni frase per conto suo */
        $('sotto-titolo').innerHTML = '<span>Cambi di stato di tutti i dispositivi</span>' +
            (ultimo ? ' · <span>ultimo evento</span> <span>' + esc(quandoFa(ultimo.ms)) + '</span>' : '');
        document.querySelectorAll('#periodo button').forEach(b => { b.classList.toggle('su', b.dataset.p === S.periodo); b.setAttribute('aria-selected', b.dataset.p === S.periodo); });
        const ds = S.periodo === 'scelto' && (S.da || S.a)
            ? [S.da, S.a].map(k => k ? dataDaChiave(k).toLocaleDateString(LOC, { day: 'numeric', month: 'short' }) : '…').join(' – ') : '';
        $('date-scelte').textContent = ds;
    }

    function aggiornaVivo() {
        const b = $('vivo');
        let cls = 'vivo', testo, titolo, ico = 'pause';
        if (!periodoVivo()) { cls += ' storico'; testo = 'Storico'; titolo = 'Periodo passato: niente aggiornamenti dal vivo'; }
        else if (!S.vivo) { testo = 'In pausa'; titolo = 'Riprendi l\'aggiornamento dal vivo (P)'; ico = 'play'; }
        else if (!S.rete) { cls += ' giu'; testo = 'Non collegato'; titolo = 'Il server non risponde: riprovo da solo'; }
        else { cls += ' su'; testo = 'Dal vivo'; titolo = 'Metti in pausa l\'aggiornamento dal vivo (P)'; }
        b.className = cls;
        b.title = titolo;
        b.innerHTML = '<span class="punto"></span><i data-lucide="' + ico + '" class="pp"></i><span class="scritta">' + esc(testo) + '</span>';
        b.setAttribute('aria-label', testo);
        icone(b);
    }

    /* =================================================================
       7. IL REGISTRO: righe virtuali
       A schermo esistono solo le righe che si vedono (piu' un margine): migliaia di
       eventi scorrono lisci anche sul telefono. Ogni voce e' messa al suo posto con
       translateY; le altezze sono fisse (CSS --h-ev / --h-giorno) tranne i dettagli
       aperti, che si misurano.
       ================================================================= */
    const V = {
        voci: [], cime: new Float64Array(0), altezzaTotale: 0, vive: new Map(), hEv: 40, hGiorno: 40, hPiu: 64,
        misuraCss() {
            const cs = getComputedStyle(document.documentElement);
            this.hEv = parseFloat(cs.getPropertyValue('--h-ev')) || 40;
            this.hGiorno = parseFloat(cs.getPropertyValue('--h-giorno')) || 40;
        },
        costruisci(morbido) {
            const voci = [];
            if (S.vis.length) {
                voci.push({ t: 'p', key: 'p' + (S.forsePiu ? 1 : 0) });
                let giorno = null, gv = null;
                for (const ev of S.vis) {
                    if (ev.d !== giorno) {
                        giorno = ev.d;
                        gv = { t: 'g', key: '', d: ev.d, n: 0, an: 0 };
                        voci.push(gv);
                    }
                    gv.n++; if (ev.liv === 'anomalia') gv.an++;
                    voci.push({ t: 'e', key: 'e' + ev.n, ev, g: gv });
                }
                /* nella chiave del giorno anche i conteggi: se cambiano, l'intestazione si rifa' da sola */
                for (const v of voci) if (v.t === 'g') v.key = 'g' + v.d + ':' + v.n + ':' + v.an;
            }
            this.voci = voci;
            this.misura();
            /* morbido (giro dal vivo): le righe gia' a schermo non si toccano, cosi' non si perdono
               il fuoco della tastiera, il testo selezionato e il passaggio del mouse */
            this.disegna(!morbido);
        },
        altezza(v) {
            if (v.t === 'g') return this.hGiorno;
            if (v.t === 'p') return this.hPiu;
            const a = S.aperti.get(v.ev.n);
            return a === undefined ? this.hEv : this.hEv + (a || 150);
        },
        misura() {
            const n = this.voci.length;
            if (this.cime.length < n + 1) this.cime = new Float64Array(Math.max(n + 1, this.cime.length * 2));
            let y = 0;
            for (let i = 0; i < n; i++) { this.cime[i] = y; y += this.altezza(this.voci[i]); }
            this.cime[n] = y;
            this.altezzaTotale = y;
            $('finestra').style.height = y + 'px';
        },
        indiceA(y) {        // prima voce che finisce dopo y
            let lo = 0, hi = this.voci.length - 1;
            while (lo < hi) { const m = (lo + hi) >> 1; if (this.cime[m + 1] <= y) lo = m + 1; else hi = m; }
            return lo;
        },
        disegna(tutto) {
            const sc = $('scorri'), fin = $('finestra');
            if (tutto) { this.vive.forEach(el => el.remove()); this.vive.clear(); }
            if (!this.voci.length) { this.giornoFisso(); return; }
            const y0 = sc.scrollTop, h = sc.clientHeight || 600, margine = 400;
            const i0 = this.indiceA(Math.max(0, y0 - margine)), i1 = this.indiceA(y0 + h + margine);
            const servono = new Set();
            let rimisura = false;
            for (let i = i0; i <= i1; i++) {
                const v = this.voci[i];
                servono.add(v.key);
                let el = this.vive.get(v.key);
                if (!el) {
                    el = document.createElement('div');
                    el.className = 'voce' + (v.t === 'e' && S.aperti.has(v.ev.n) ? ' aperta' : '');
                    el.innerHTML = htmlVoce(v);
                    fin.appendChild(el);
                    this.vive.set(v.key, el);
                    if (v.t === 'e' && S.aperti.has(v.ev.n)) {
                        const d = el.querySelector('.dett');
                        const a = d ? d.offsetHeight : 0;
                        if (a && a !== S.aperti.get(v.ev.n)) { S.aperti.set(v.ev.n, a); rimisura = true; }
                    }
                    icone(el);
                }
                el.style.transform = 'translateY(' + this.cime[i] + 'px)';
            }
            this.vive.forEach((el, k) => { if (!servono.has(k)) { el.remove(); this.vive.delete(k); } });
            if (rimisura) { this.misura(); this.vive.forEach(el => el.remove()); this.vive.clear(); this.disegna(false); return; }
            this.giornoFisso();
        },
        /* l'intestazione del giorno resta ferma in cima; la successiva la spinge via */
        giornoFisso() {
            const box = $('giorno-fisso');
            const sc = $('scorri');
            box.style.right = Math.max(0, sc.offsetWidth - sc.clientWidth) + 'px';
            if (!this.voci.length || sc.scrollTop <= 0) { box.innerHTML = ''; box.dataset.k = ''; return; }
            const i = this.indiceA(sc.scrollTop);
            const v = this.voci[i];
            const g = v.t === 'g' ? v : (v.t === 'e' ? v.g : null);
            if (!g) { box.innerHTML = ''; box.dataset.k = ''; return; }
            if (box.dataset.k !== g.key + g.n) { box.innerHTML = htmlGiorno(g); box.dataset.k = g.key + g.n; icone(box); }
            let prossimo = -1;
            for (let j = i + 1; j < Math.min(this.voci.length, i + 60); j++) if (this.voci[j].t === 'g') { prossimo = j; break; }
            const spinta = prossimo >= 0 ? Math.min(0, this.cime[prossimo] - sc.scrollTop - this.hGiorno) : 0;
            box.style.transform = 'translateY(' + spinta + 'px)';
        },
        vaiA(i) {
            const sc = $('scorri');
            sc.scrollTop = Math.max(0, this.cime[i] - this.hGiorno - 4);
            S.segui = false;
            this.disegna(false);
            aggiornaTorna();
        },
        scorriDi(dy) { const sc = $('scorri'); sc.scrollTop += dy; this.disegna(false); },
    };

    function vaiInFondo() {
        const sc = $('scorri');
        sc.scrollTop = sc.scrollHeight;
        S.segui = true; S.nuovi = 0;
        V.disegna(false);
        aggiornaTorna();
    }
    function aggiornaTorna() {
        const sc = $('scorri');
        const si = !S.segui && V.voci.length && sc.scrollHeight > sc.clientHeight + 8;
        $('torna').classList.toggle('su', !!si);
        $('nuovi').textContent = S.nuovi ? '+' + num(S.nuovi) : '';
    }

    /* --- le voci --- */
    function evidenzia(testo) {
        const t = String(testo);
        if (!S.parole.length) return esc(t);
        const basso = norm(t);
        if (basso.length !== t.length) return esc(t);      // lettere composte: niente evidenza, meglio che sbagliata
        const segni = new Array(t.length).fill(false);
        S.parole.forEach(p => { let i = basso.indexOf(p); while (p && i >= 0) { for (let j = i; j < i + p.length; j++) segni[j] = true; i = basso.indexOf(p, i + p.length); } });
        let h = '', dentro = false;
        for (let i = 0; i < t.length; i++) {
            if (segni[i] && !dentro) { h += '<mark>'; dentro = true; }
            if (!segni[i] && dentro) { h += '</mark>'; dentro = false; }
            h += esc(t[i]);
        }
        return h + (dentro ? '</mark>' : '');
    }
    function etichettaGiorno(k) {
        const oggi = oggiChiave();
        if (k === oggi) return 'Oggi';
        if (k === spostaGiorno(oggi, -1)) return 'Ieri';
        const d = dataDaChiave(k).toLocaleDateString(LOC, { weekday: 'long' });
        return d.charAt(0).toUpperCase() + d.slice(1);
    }
    function htmlGiorno(g) {
        const d = dataDaChiave(g.d);
        const etichetta = etichettaGiorno(g.d);
        const vicino = etichetta === 'Oggi' || etichetta === 'Ieri';
        const data = d.toLocaleDateString(LOC, vicino ? { weekday: 'long', day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' });
        return '<div class="giorno"><span class="cal"><i data-lucide="calendar"></i></span>' +
            '<b' + (vicino ? '' : ' data-no-tr') + '>' + esc(etichetta) + '</b><span class="data data-lunga" data-no-tr>' + esc(data) + '</span>' +
            '<span class="mix">' + (g.an ? '<span class="an"><i data-lucide="triangle-alert"></i><span data-no-tr>' + num(g.an) + '</span></span>' : '') +
            '<span><span data-no-tr>' + num(g.n) + '</span> ' + (g.n === 1 ? 'evento' : 'eventi') + '</span></span></div>';
    }
    function htmlVoce(v) {
        if (v.t === 'g') return htmlGiorno(v);
        if (v.t === 'p') {
            return S.forsePiu
                ? '<div class="piu"><button type="button" onclick="MON.piuVecchi()"><i data-lucide="history"></i>Carica eventi più vecchi</button></div>'
                : '<div class="piu inizio"><i data-lucide="flag"></i>Inizio del registro in questo periodo</div>';
        }
        const ev = v.ev;
        const L = LIVELLI[ev.liv], F = famigliaInfo(ev.fam);
        const aperta = S.aperti.has(ev.n);
        const cls = 'ev' + (ev.liv === 'anomalia' ? (ev.grave ? ' errore' : ' anomalia') : '') + (ev.nuovo && performance.now() - ev.nuovo < 1800 ? ' nuova' : '');
        let delta = '';
        if (ev.liv === 'misura' && ev.p && ev.p.liv === 'misura') {
            const dd = Math.round((ev.num - ev.p.num) * 1000) / 1000;
            if (dd) delta = '<span class="d" title="Differenza dalla misura precedente"><i data-lucide="' + (dd > 0 ? 'arrow-up' : 'arrow-down') + '"></i>' + esc(cifra(Math.abs(dd))) + '</span>';
        } else if (ev.p && ev.liv !== 'misura') {
            delta = '<span class="d" title="Durata dello stato precedente"><i data-lucide="timer"></i>' + esc(durata(ev.ms - ev.p.ms)) + '</span>';
        }
        const lc = ev.grave ? 'var(--rosso)' : L.c;
        return '<div class="' + cls + '" tabindex="0" role="button" aria-expanded="' + aperta + '" data-n="' + ev.n + '">' +
            '<span class="ora">' + ev.ora + '<i>:' + ev.sec + '</i></span>' +
            '<span class="lv ' + ev.liv + '" style="--lc:' + lc + '"><i></i><span>' + esc(parolaDi(ev)) + '</span></span>' +
            '<span class="fonte" title="' + esc(F.nome) + '" style="--c:' + F.c + '"><span class="q"><i data-lucide="' + (ev.eid.startsWith('media_player.tv_') ? 'tv' : F.icona) + '"></i></span><span>' + esc(F.nome) + '</span></span>' +
            '<span class="chi" data-no-tr><b>' + evidenzia(nomeDi(ev.eid)) + '</b><code>' + evidenzia(ev.eid) + '</code></span>' +
            '<span class="val"><span class="v" data-no-tr title="' + esc(ev.st) + '">' + evidenzia(ev.st || '—') + '</span>' + delta + '</span>' +
            '<i data-lucide="chevron-right" class="freccia"></i></div>' +
            (aperta ? htmlDettaglio(ev) : '');
    }

    function htmlDettaglio(ev) {
        const F = famigliaInfo(ev.fam);
        const d = new Date(ev.ms);
        const quando = dataDaChiave(ev.d).toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const integ = integrazioneDi(ev.eid);
        let cambio, sotto;
        if (ev.p) {
            cambio = '<div class="cambio" data-no-tr><span class="v prima">' + esc(ev.p.st || '—') + '</span><i data-lucide="arrow-right"></i><span class="v">' + esc(ev.st || '—') + '</span></div>';
            sotto = '<div class="sotto">' + (ev.liv === 'misura' && ev.p.liv === 'misura'
                ? 'Differenza' + ' <b class="mono" data-no-tr>' + esc((ev.num - ev.p.num > 0 ? '+' : '') + cifra(ev.num - ev.p.num)) + '</b> · '
                : 'Stato precedente durato' + ' <b data-no-tr>' + esc(durata(ev.ms - ev.p.ms)) + '</b> · ') +
                'dalle' + ' <span class="mono" data-no-tr>' + esc(ev.p.ora + ':' + ev.p.sec) + '</span></div>';
        } else {
            cambio = '<div class="cambio" data-no-tr><span class="v">' + esc(ev.st || '—') + '</span></div>';
            sotto = '<div class="sotto">Primo evento di questo dispositivo fra quelli caricati</div>';
        }
        return '<div class="dett">' +
            '<div class="blocco"><h5>Quando</h5><div class="grande mono" data-no-tr>' + ev.ora + ':' + ev.sec + '</div>' +
                '<div class="sotto"><span data-no-tr>' + esc(quando) + '</span><br>' + esc(quandoFa(ev.ms)) + '</div></div>' +
            '<div class="blocco"><h5>Cambio di stato</h5>' + cambio + sotto + storia(ev) + '</div>' +
            '<div class="blocco disp"><h5>Dispositivo</h5><div class="grande" data-no-tr>' + esc(nomeDi(ev.eid)) + '</div>' +
                '<div class="id"><code data-no-tr>' + esc(ev.eid) + '</code><button class="mini" type="button" title="Copia l\'id" onclick="MON.copiaId(event, ' + ev.n + ')"><i data-lucide="copy"></i></button></div>' +
                '<div class="sotto">' + esc(F.nome) + (integ ? ' · ' + esc(integ) : '') + '</div></div>' +
            '<div class="comandi">' +
                (S.entita === ev.eid
                    ? '<button class="btn piccolo" type="button" onclick="MON.soloEntita(\'\')"><i data-lucide="layers"></i>Tutti i dispositivi</button>'
                    : '<button class="btn piccolo" type="button" onclick="MON.soloEntitaN(' + ev.n + ')"><i data-lucide="crosshair"></i>Solo questo dispositivo</button>') +
                '<button class="btn piccolo" type="button" onclick="MON.copiaRiga(' + ev.n + ')"><i data-lucide="clipboard-copy"></i>Copia la riga</button>' +
            '</div></div>';
    }

    /* la storia recente dell'entita': una linea per le misure, un nastro acceso/spento per il resto */
    function storia(ev) {
        const serie = [];
        for (let e = ev; e && serie.length < 40; e = e.p) serie.push(e);
        serie.reverse();
        if (serie.length < 2) return '';
        if (ev.liv === 'misura') {
            const pts = serie.filter(e => e.liv === 'misura');
            if (pts.length < 2) return '';
            const min = Math.min(...pts.map(e => e.num)), max = Math.max(...pts.map(e => e.num));
            const t0 = pts[0].ms, t1 = pts[pts.length - 1].ms || t0 + 1;
            const W = 240, H = 30;
            const x = e => (t1 === t0 ? 0 : (e.ms - t0) / (t1 - t0) * W), y = e => (max === min ? H / 2 : H - 3 - (e.num - min) / (max - min) * (H - 6));
            const linea = pts.map((e, i) => (i ? 'L' : 'M') + x(e).toFixed(1) + ' ' + y(e).toFixed(1)).join(' ');
            const u = pts[pts.length - 1];
            return '<svg class="storia" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="Andamento recente">' +
                '<path d="' + linea + '" fill="none" stroke="var(--accento)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
                '<circle cx="' + x(u).toFixed(1) + '" cy="' + y(u).toFixed(1) + '" r="3" fill="var(--accento)" stroke="var(--pieno)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>' +
                '<div class="scala"><span>min <b data-no-tr>' + esc(cifra(min)) + '</b></span><span>max <b data-no-tr>' + esc(cifra(max)) + '</b></span><span><b data-no-tr>' + pts.length + '</b> ' + (pts.length === 1 ? 'valore' : 'valori') + '</span></div>';
        }
        const t0 = serie[0].ms, t1 = ev.ms;
        if (t1 <= t0) return '';
        let h = '';
        for (let i = 0; i < serie.length - 1; i++) {
            const e = serie[i], w = (serie[i + 1].ms - e.ms) / (t1 - t0) * 100;
            const c = e.grave ? 'var(--rosso)' : e.liv === 'spento' ? 'var(--riga-su)' : LIVELLI[e.liv].c;
            h += '<i style="flex:' + Math.max(w, 0.4).toFixed(2) + ' 0 0;background:' + c + '" title="' + esc(e.st) + ' · ' + esc(durata(serie[i + 1].ms - e.ms)) + '"></i>';
        }
        return '<div class="nastro" aria-label="Storia recente">' + h + '</div>';
    }

    function apriChiudi(n) {
        if (S.aperti.has(n)) S.aperti.delete(n); else S.aperti.set(n, 0);
        const idx = V.voci.findIndex(v => v.t === 'e' && v.ev.n === n);
        const vecchio = V.vive.get('e' + n);
        if (vecchio) { vecchio.remove(); V.vive.delete('e' + n); }
        V.misura();
        V.disegna(false);
        /* un dettaglio aperto in fondo si deve vedere tutto */
        if (idx >= 0 && S.aperti.has(n)) {
            const sc = $('scorri');
            const fondo = V.cime[idx + 1];
            /* 64: sopra al pulsante 'Torna al vivo', che compare appena la vista non e' piu' in fondo */
            if (fondo > sc.scrollTop + sc.clientHeight - 64) { sc.scrollTop = fondo - sc.clientHeight + 64; V.disegna(false); }
        }
        const el = V.vive.get('e' + n);
        if (el) { const r = el.querySelector('.ev'); if (r) r.focus({ preventScroll: true }); }
        aggiornaTorna();
    }

    /* =================================================================
       8. STATI: caricamento, vuoto, errore
       ================================================================= */
    function mostraCaricamento() {
        let h = '<div>';
        for (let i = 0; i < 12; i++) {
            h += '<div class="ev" style="cursor:default"><div class="scheletro" style="width:62px"></div><div class="scheletro" style="width:' + (70 + (i * 23) % 50) + 'px;height:20px"></div>' +
                '<div class="scheletro" style="width:22px;height:22px;border-radius:7px"></div><div class="scheletro" style="width:' + (130 + (i * 47) % 160) + 'px"></div>' +
                '<div class="scheletro" style="width:54px;height:20px;justify-self:end"></div><span></span></div>';
        }
        $('stato-reg').innerHTML = h + '</div>';
    }
    function disegnaStato() {
        const box = $('stato-reg');
        let h = '';
        if (S.errore && !S.ev.length) {
            const sess = S.errore.tipo === 'sessione';
            h = vuoto(['circle-alert', sess ? 'lock' : 'wifi-off', 'server'], 'var(--rosso)',
                sess ? 'La sessione è scaduta' : 'Il registro non risponde',
                S.errore.message || '',
                sess ? '<a class="btn primario" href="/login"><i data-lucide="log-in"></i>Accedi di nuovo</a>'
                     : '<button class="btn primario" type="button" onclick="MON.ricarica()"><i data-lucide="refresh-cw"></i>Riprova</button>');
        } else if (!S.ev.length) {
            if (S.periodo !== 'tutto') {
                h = vuoto(['calendar-days', 'inbox', 'history'], 'var(--accento)', 'Nessun evento in questo periodo',
                    'In questi giorni nessun dispositivo ha cambiato stato. Prova un periodo più ampio.',
                    '<button class="btn primario" type="button" onclick="MON.periodo(\'tutto\')"><i data-lucide="history"></i>Mostra tutto</button>', periodoVivo());
            } else {
                h = vuoto(['lightbulb', 'scroll-text', 'thermometer'], 'var(--accento)', 'Il registro è vuoto',
                    'Qui compare ogni cambio di stato dei dispositivi: luci, tapparelle, sensori, clima. La pagina è in ascolto e il primo evento arriverà da solo.', '', true);
            }
        } else if (!S.vis.length) {
            h = vuoto(['search', 'filter', 'list'], 'var(--fioco)', 'Nessun evento corrisponde',
                S.q ? 'Nessun evento contiene «' + S.q + '» con i filtri scelti.' : 'Con i filtri scelti non resta nessun evento.',
                '<button class="btn primario" type="button" onclick="MON.azzera()"><i data-lucide="rotate-ccw"></i>Azzera i filtri</button>');
        }
        box.innerHTML = h;
        if (h) icone(box);
        $('interno').classList.toggle('guasto', !!(S.errore && !S.ev.length));
        aggiornaTorna();
    }
    function vuoto(ic, c, titolo, testo, azioni, ascolto) {
        return '<div class="vuoto"><div class="pila">' + ic.map(i => '<span style="--c:' + c + '"><i data-lucide="' + i + '"></i></span>').join('') + '</div>' +
            '<h2>' + esc(titolo) + '</h2><p>' + esc(testo) + '</p>' + (azioni ? '<div class="azioni">' + azioni + '</div>' : '') +
            (ascolto && S.vivo ? '<div class="ascolto"><i></i>In ascolto</div>' : '') + '</div>';
    }

    /* =================================================================
       9. ESPORTA E COPIA (quello che si vede, filtri compresi)
       ================================================================= */
    function righeTesto(evs, sep) {
        const q = v => { const s = String(v == null ? '' : v); return sep === ';' && /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s.replace(/\t/g, ' '); };
        const testa = [tr('Data'), tr('Ora'), tr('Evento'), tr('Fonte'), tr('Dispositivo'), 'entity_id', tr('Valore')];
        const righe = [testa.map(q).join(sep)];
        for (const ev of evs) {
            const [y, m, d] = ev.d.split('-');
            righe.push([d + '/' + m + '/' + y, ev.ora + ':' + ev.sec, tr(parolaDi(ev)), tr(famigliaInfo(ev.fam).nome), nomeDi(ev.eid), ev.eid, ev.st].map(q).join(sep));
        }
        return righe.join('\r\n');
    }
    async function negliAppunti(testo) {
        try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(testo); return true; } } catch (e) {}
        /* sulla rete di casa (http) navigator.clipboard non c'e': si passa da un campo nascosto */
        const ta = document.createElement('textarea');
        ta.value = testo; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
        return ok;
    }
    function apriMenu(e) {
        const m = $('menu');
        if (m.classList.contains('su')) return chiudiMenu();
        const filtrato = S.q || S.liv || S.fam || S.entita || S.periodo !== 'tutto';
        $('menu-intesta').innerHTML = '<b data-no-tr>' + num(S.vis.length) + '</b> ' + (S.vis.length === 1 ? 'evento' : 'eventi') + ' ' +
            (filtrato ? 'con i filtri e il periodo scelti' : 'caricati');
        m.querySelectorAll('button').forEach(b => b.disabled = !S.vis.length);
        const r = $('bt-esporta').getBoundingClientRect();
        m.style.top = (r.bottom + 8) + 'px';
        m.style.left = Math.max(12, Math.min(window.innerWidth - 302, r.right - 290)) + 'px';
        m.classList.add('su');
        e && e.stopPropagation();
        const primo = m.querySelector('button:not(:disabled)'); if (primo) primo.focus();
    }
    function chiudiMenu() { $('menu').classList.remove('su'); }
    document.addEventListener('click', e => {
        if (!e.target.closest('#menu')) chiudiMenu();
        if (!e.target.closest('#foglietto') && !e.target.closest('#bt-scelto')) $('foglietto').classList.remove('su');
    });

    /* =================================================================
       10. COMANDI, TASTIERA, TEMA
       ================================================================= */
    function applicaNotte(si) {
        document.body.classList.toggle('notte', si);
        $('meta-tema').setAttribute('content', si ? '#0D0F13' : '#EFEFF4');
        $('bt-notte').innerHTML = '<i data-lucide="' + (si ? 'sun' : 'moon') + '"></i>';
        icone($('bt-notte'));
    }
    const notteSalvata = memo.leggi('monitor_notte', null);
    applicaNotte(notteSalvata == null ? !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) : !!notteSalvata);

    function applicaCompatto(si) {
        $('interno').classList.toggle('compatto', si);
        const b = $('bt-compatto');
        b.title = si ? 'Mostra il riepilogo' : 'Nascondi il riepilogo';
        b.innerHTML = '<i data-lucide="' + (si ? 'panel-top-open' : 'panel-top-close') + '"></i>';
        icone(b);
    }
    applicaCompatto(!!memo.leggi('monitor_compatto', false));

    const q = $('q');
    let tempoQ = null;
    q.addEventListener('input', () => {
        $('cerca').classList.toggle('piena', !!q.value);
        clearTimeout(tempoQ);
        tempoQ = setTimeout(() => {
            S.q = q.value.trim();
            S.parole = norm(S.q).split(/\s+/).filter(Boolean);
            S.aperti.clear();
            ricalcola();
            vaiInFondo();
        }, S.ev.length > 4000 ? 120 : 40);
    });
    document.querySelectorAll('#periodo button').forEach(b => b.addEventListener('click', e => {
        if (b.dataset.p === 'scelto') {
            e.stopPropagation();
            const f = $('foglietto');
            if (f.classList.contains('su')) { f.classList.remove('su'); return; }
            const r = intervallo();
            $('data-da').value = S.da || r.da || spostaGiorno(oggiChiave(), -6);
            $('data-a').value = S.a || r.a || oggiChiave();
            $('data-da').max = $('data-a').max = oggiChiave();
            f.classList.add('su');
            return;
        }
        cambiaPeriodo(b.dataset.p);
    }));
    function cambiaPeriodo(p) {
        S.periodo = p; S.limite = PASSO; S.nuovi = 0;
        memo.scrivi('monitor_periodo', p);
        disegnaTesta();
        carica({});
    }

    $('filtri').addEventListener('scroll', () => { const fl = $('filtri'); fl.classList.toggle('lunghi', fl.scrollLeft + fl.clientWidth < fl.scrollWidth - 4); }, { passive: true });

    const scorri = $('scorri');
    let rafScorri = 0;
    scorri.addEventListener('scroll', () => {
        if (rafScorri) return;
        rafScorri = requestAnimationFrame(() => {
            rafScorri = 0;
            V.disegna(false);
            const inFondo = scorri.scrollTop + scorri.clientHeight >= scorri.scrollHeight - 30;
            if (inFondo !== S.segui) { S.segui = inFondo; if (inFondo) S.nuovi = 0; }
            else if (inFondo && S.nuovi) S.nuovi = 0;
            aggiornaTorna();
        });
    }, { passive: true });
    scorri.addEventListener('click', e => {
        const r = e.target.closest('.ev[data-n]');
        if (!r || e.target.closest('button, a, .dett')) return;
        if (window.getSelection && String(window.getSelection()).length) return;   // si stava selezionando del testo
        apriChiudi(+r.dataset.n);
    });
    let tempoRes = null;
    window.addEventListener('resize', () => {
        clearTimeout(tempoRes);
        tempoRes = setTimeout(() => {
            const eraInFondo = S.segui;
            V.misuraCss();
            S.aperti.forEach((v, k) => S.aperti.set(k, 0));
            V.misura(); V.disegna(true);
            if (eraInFondo) vaiInFondo();
            chiudiMenu();
        }, 120);
    });

    document.addEventListener('keydown', e => {
        const scrivendo = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');
        if (e.key === 'Escape') {
            if (document.querySelector('.wh-pop')) return;
            if ($('menu').classList.contains('su')) { chiudiMenu(); $('bt-esporta').focus(); return; }
            if ($('foglietto').classList.contains('su')) { $('foglietto').classList.remove('su'); return; }
            if (S.q) { MON.pulisciRicerca(); q.blur(); return; }
            if (S.aperti.size) { S.aperti.clear(); V.misura(); V.disegna(true); return; }
            return;
        }
        if (scrivendo || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.wh-pop')) return;
        if (e.key === '/') { e.preventDefault(); q.focus(); q.select(); }
        else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); MON.pausa(); }
        else if (e.key === 'End' || e.key === 'g' || e.key === 'G') { e.preventDefault(); MON.alVivo(); }
        else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ev') && e.target.dataset.n) { e.preventDefault(); apriChiudi(+e.target.dataset.n); }
        else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'j' || e.key === 'k') && e.target.classList && e.target.classList.contains('ev')) {
            e.preventDefault();
            const giu = e.key === 'ArrowDown' || e.key === 'j';
            const n = +e.target.dataset.n;
            let i = V.voci.findIndex(v => v.t === 'e' && v.ev.n === n);
            do { i += giu ? 1 : -1; } while (i >= 0 && i < V.voci.length && V.voci[i].t !== 'e');
            if (i < 0 || i >= V.voci.length) return;
            const sc = $('scorri');
            if (V.cime[i] < sc.scrollTop + V.hGiorno) sc.scrollTop = V.cime[i] - V.hGiorno;
            else if (V.cime[i] + V.hEv > sc.scrollTop + sc.clientHeight) sc.scrollTop = V.cime[i] + V.hEv - sc.clientHeight;
            V.disegna(false);
            const el = V.vive.get(V.voci[i].key);
            if (el) el.querySelector('.ev').focus({ preventScroll: true });
        }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) giro(); });

    const trovaEv = n => S.ev.find(e => e.n === n);
    window.MON = {
        pausa: () => {
            if (!periodoVivo()) return;
            S.vivo = !S.vivo;
            aggiornaVivo();
            biscotto(S.vivo ? 'Aggiornamento dal vivo ripreso' : 'Aggiornamento dal vivo in pausa', S.vivo ? '' : 'Premi P o il pulsante per riprendere.', 'bene', 2200);
            if (S.vivo) giro();
            disegnaStato();
        },
        alVivo: () => {
            const sc = $('scorri');
            const lontano = sc.scrollHeight - sc.scrollTop - sc.clientHeight > 5000;
            if (lontano) vaiInFondo();
            else { sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }); S.nuovi = 0; aggiornaTorna(); }
        },
        perLivello: k => { S.liv = S.liv === k ? '' : k; S.aperti.clear(); ricalcola(); vaiInFondo(); },
        perFamiglia: k => { S.fam = S.fam === k ? '' : k; S.aperti.clear(); ricalcola(); vaiInFondo(); },
        soloEntita: eid => { S.entita = eid; S.aperti.clear(); ricalcola(); vaiInFondo(); },
        primo: () => { const eid = $('g-primo').dataset.eid; if (eid) MON.soloEntita(eid); },
        soloEntitaN: n => { const ev = trovaEv(n); if (!ev) return; S.entita = ev.eid; ricalcola(); vaiInFondo(); },
        azzera: () => { S.q = ''; S.parole = []; S.liv = ''; S.fam = ''; S.entita = ''; q.value = ''; $('cerca').classList.remove('piena'); S.aperti.clear(); ricalcola(); vaiInFondo(); },
        pulisciRicerca: () => { q.value = ''; S.q = ''; S.parole = []; $('cerca').classList.remove('piena'); ricalcola(); vaiInFondo(); q.focus(); },
        periodo: p => cambiaPeriodo(p),
        applicaDate: () => {
            let da = $('data-da').value, a = $('data-a').value;
            if (da && a && da > a) [da, a] = [a, da];
            S.da = da; S.a = a;
            memo.scrivi('monitor_da', da); memo.scrivi('monitor_a', a);
            $('foglietto').classList.remove('su');
            cambiaPeriodo(da || a ? 'scelto' : 'tutto');
        },
        chiudiDate: () => $('foglietto').classList.remove('su'),
        piuVecchi,
        ricarica: () => carica({}),
        compatto: () => { const si = !$('interno').classList.contains('compatto'); memo.scrivi('monitor_compatto', si); applicaCompatto(si); const eraInFondo = S.segui; V.disegna(false); if (eraInFondo) vaiInFondo(); },
        notte: () => { const si = !document.body.classList.contains('notte'); memo.scrivi('monitor_notte', si); applicaNotte(si); },
        menu: apriMenu,
        copia: async () => {
            chiudiMenu();
            const ok = await negliAppunti(righeTesto(S.vis, '\t'));
            if (ok) biscotto(S.vis.length === 1 ? 'Copiato 1 evento' : 'Copiati ' + num(S.vis.length) + ' eventi', 'Incollali in un foglio di calcolo o in un messaggio.', 'bene');
            else avvisa('Il browser non ha permesso di copiare. Usa «Scarica in CSV».', { titolo: 'Copia non riuscita', icona: 'alert-circle' });
        },
        scarica: () => {
            chiudiMenu();
            const blob = new Blob(['﻿' + righeTesto(S.vis, ';')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = tr('registro-eventi') + '-' + oggiChiave() + '.csv';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            biscotto('File CSV pronto', num(S.vis.length) + ' ' + (S.vis.length === 1 ? 'evento' : 'eventi'), 'bene');
        },
        copiaId: async (e, n) => { e.stopPropagation(); const ev = trovaEv(n); if (ev && await negliAppunti(ev.eid)) biscotto('Id copiato', ev.eid, 'bene', 2000); },
        copiaRiga: async n => { const ev = trovaEv(n); if (ev && await negliAppunti(righeTesto([ev], '\t').split('\r\n')[1])) biscotto('Riga copiata', '', 'bene', 2000); },
        svuota: async () => {
            const ok = await chiedi('Verranno cancellati tutti gli eventi registrati finora, anche quelli fuori dal periodo che stai guardando. L\'operazione non si può annullare.',
                { titolo: 'Svuotare il registro?', si: 'Svuota il registro', no: 'Annulla', pericolo: true, icona: 'trash-2' });
            if (!ok) return;
            const b = $('bt-svuota');
            b.disabled = true;
            try {
                const r = await api('/api/logs', { method: 'DELETE' });
                if (r && r.status && r.status !== 'success') throw { message: r.message || 'Errore del server' };
                S.ev = []; S.nuovi = 0; S.aperti.clear(); S.forsePiu = false;
                ricalcola();
                biscotto('Registro svuotato', 'I nuovi eventi compariranno qui man mano.', 'bene');
            } catch (e) {
                avvisa((e && e.message) || 'Il server non ha risposto.', { titolo: 'Registro non svuotato', icona: 'alert-circle' });
            } finally { b.disabled = false; }
        },
    };

    /* =================================================================
       11. PARTENZA
       ================================================================= */
    V.misuraCss();
    disegnaTesta();
    aggiornaVivo();
    icone();
    carica({});
    setInterval(giro, 3000);
    /* "ultimo evento 12 s fa" e le ore del grafico restano giusti anche senza eventi nuovi */
    setInterval(() => { if (!document.hidden) { disegnaTesta(); if (!S.caricando) disegnaGrafico(); } }, 30000);
})();
</script>
</body>
</html>
