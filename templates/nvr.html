<style>

<div class="nvr-pagina" id="nvr-pagina">
    <div class="nvr-testa">
        <button class="imp-back" onclick="nvrChiudi()" title="Torna all'app"><i data-lucide="chevron-left"></i><span>App</span></button>
        <h2>Registrazioni</h2>
        <span class="nvr-rec" id="nvr-rec"><i></i>REC</span>
        <button class="nvr-ib" onclick="nvrApriArchivio()" title="Archivio"><i data-lucide="folder-open"></i></button>
    </div>
    <div class="nvr-corpo">
      <div class="nvr-int">
        <div class="nvr-chips" id="nvr-chips"></div>
        <div class="nvr-avviso" id="nvr-avviso"><i data-lucide="usb"></i><span>Unità di archivio non collegata: le registrazioni riprenderanno appena torna disponibile.</span></div>
        <div class="nvr-video-box" id="nvr-video-box">
            <video id="nvr-video" playsinline webkit-playsinline muted preload="metadata"></video>
            <div class="nvr-video-ora" id="nvr-video-ora">--:--:--</div>
            <div class="nvr-video-cam" id="nvr-video-cam"><i data-lucide="cctv"></i><span data-no-tr id="nvr-video-cam-n"></span><small id="nvr-video-cam-g"></small></div>
            <div class="nvr-video-msg on" id="nvr-video-msg"><i data-lucide="film"></i><span>Scegli un momento sulla linea del tempo</span></div>
            <div class="nvr-video-btn">
                <a id="nvr-scarica" href="#" download title="Scarica" style="display:none;"><i data-lucide="download"></i></a>
                <button type="button" onclick="nvrSchermoIntero()" title="Schermo intero"><i data-lucide="maximize"></i></button>
            </div>
        </div>
        <div class="nvr-giorni">
            <button class="nvr-ib" id="nvr-g-prev" onclick="nvrCambiaGiorno(-1)" title="Giorno precedente"><i data-lucide="chevron-left"></i></button>
            <div class="nvr-giorni-strip" id="nvr-giorni"></div>
            <button class="nvr-ib" id="nvr-g-next" onclick="nvrCambiaGiorno(1)" title="Giorno successivo"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="nvr-riga-cmd">
            <div class="nvr-live" id="nvr-live"></div>
            <div class="nvr-zoom" id="nvr-zoom">
                <button type="button" data-z="86400" class="attivo" onclick="nvrZoom(86400)">24h</button>
                <button type="button" data-z="21600" onclick="nvrZoom(21600)">6h</button>
                <button type="button" data-z="3600" onclick="nvrZoom(3600)">1h</button>
                <button type="button" data-z="600" onclick="nvrZoom(600)">10m</button>
            </div>
        </div>
        <div class="nvr-tl" id="nvr-tl">
            <div class="nvr-tl-scroll" id="nvr-tl-scroll"><div id="nvr-tl-pista" style="position:relative; height:96px;"><canvas id="nvr-tl-canvas" height="96" style="position:absolute; left:0; top:0;"></canvas></div></div>
            <div class="nvr-tl-cursore"></div>
            <div class="nvr-tl-ora" id="nvr-tl-ora">00:00:00</div>
        </div>
        <div class="nvr-tl-legenda"><span><i style="background:#0A84FF"></i>Registrazione</span><span><i style="background:#FF453A"></i>In corso</span><span><i style="background:#FFD60A"></i>Evento</span></div>
        <div class="nvr-trasporto">
            <button class="nvr-ib" onclick="nvrSalta(-1)" title="Spezzone precedente"><i data-lucide="skip-back"></i></button>
            <button class="nvr-ib" onclick="nvrAvanza(-10)" title="-10 s"><i data-lucide="rotate-ccw"></i></button>
            <button class="nvr-ib nvr-play" id="nvr-play" onclick="nvrPlayPausa()" title="Riproduci"><i data-lucide="play"></i></button>
            <button class="nvr-ib" onclick="nvrAvanza(10)" title="+10 s"><i data-lucide="rotate-cw"></i></button>
            <button class="nvr-ib" onclick="nvrSalta(1)" title="Spezzone successivo"><i data-lucide="skip-forward"></i></button>
            <button class="nvr-ib nvr-vel" id="nvr-vel" onclick="nvrVelocita()" title="Velocit&agrave;" data-no-tr>1&times;</button>
        </div>
        <div class="nvr-sez">
            <div><div class="nvr-sez-t">Registrazioni del giorno</div><div class="nvr-sez-s" id="nvr-riepilogo"></div></div>
            <button class="nvr-ib pericolo" id="nvr-del-giorno" onclick="nvrEliminaGiorno()" title="Elimina le registrazioni del giorno" style="display:none;"><i data-lucide="trash-2"></i></button>
        </div>
        <div class="nvr-elenco" id="nvr-elenco"><div class="nvr-vuoto">Caricamento...</div></div>
      </div>
    </div>

    <!-- ARCHIVIO: le registrazioni viste come cartelle (telecamera > giorno), spazio, cancellazioni -->
    <div class="nvr-velo" id="nvr-velo" onclick="nvrChiudiArchivio()"></div>
    <div class="nvr-sheet" id="nvr-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Archivio">
        <div class="nvr-sheet-h">
            <h3>Archivio<small id="nvr-arch-cartella" data-no-tr></small></h3>
            <button class="nvr-ib" onclick="nvrChiudiArchivio()" title="Chiudi"><i data-lucide="x"></i></button>
        </div>
        <div class="nvr-sheet-c" id="nvr-arch-c"><div class="nvr-vuoto">Caricamento...</div></div>
    </div>
</div>

<script>
(function () {
    const P = document.getElementById('nvr-pagina');
    const video = document.getElementById('nvr-video');
    const scroll = document.getElementById('nvr-tl-scroll');
    const canvas = document.getElementById('nvr-tl-canvas');
    const pista = document.getElementById('nvr-tl-pista');
    const ADMIN = {{ 'true' if session.get('role') == 'admin' else 'false' }};
    const ALT = 96;
    const MOTIVI = { sempre: 'Continua', orari: 'Fascia oraria', eventi: 'Evento', manuale: 'Manuale' };

    let cams = [], camId = null, giorni = [], giorno = null, t0 = 0;
    let archivio = null, giorniInfo = {};        // /api/nvr/archivio e, per la telecamera scelta, {giorno: {n, mb, sec}}
    let recs = [], eventi = [], inCorso = null, segmentoSec = 300, DUR = 86400, archivioOk = true;   // DUR: secondi del giorno mostrato (23 o 25 h con l'ora legale)
    let velocita = 1, offsetAtteso = 0;
    let finestra = 86400, pxs = 0, W = 0;   // secondi visibili nella larghezza, pixel al secondo, larghezza
    let larg = 0, cw = 0, disegnatoDa = 0;  // pista intera, tela (al massimo 3 schermate), dove parte la tela
    let corrente = null;                   // spezzone caricato nel player
    let voleva = false;                    // l'utente vuole vedere (play premuto)
    let ultimoT = 0;                       // istante (epoch) sotto il cursore
    let scrubbing = false, tScrub = null, tAggiorna = null, dragX = null, dragMosso = 0, dragScroll = 0;
    const gruppiChiusi = new Set();        // ore chiuse dall'utente nell'elenco (si ricordano per il giorno)

    const pad2 = n => String(n).padStart(2, '0');
    const hms = T => { const d = new Date(T * 1000); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };
    const hm = T => hms(T).slice(0, 5);
    const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    const oggi = () => ymd(new Date());
    const daYmd = g => { const p = g.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
    const icone = el => { if (window.lucide) lucide.createIcons({ root: el }); };
    const $ = id => document.getElementById(id);
    const lingua = () => document.documentElement.lang || 'it-IT';
    const durata = sec => { sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return h ? (h + ' h ' + (m ? m + ' min' : '')).trim() : (m ? m + ' min' : sec + ' s'); };
    const mega = mb => mb >= 1000 ? (mb / 1000).toFixed(mb >= 10000 ? 0 : 1) + ' GB' : Math.round(mb) + ' MB';

    function etichettaGiorno(g, corta) {
        if (g === oggi()) return 'Oggi';
        const ieri = new Date(); ieri.setDate(ieri.getDate() - 1);
        if (g === ymd(ieri)) return 'Ieri';
        return daYmd(g).toLocaleDateString(lingua(), corta ? { weekday: 'short', day: 'numeric' } : { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function messaggio(testo, icona) {
        const m = $('nvr-video-msg');
        m.classList.toggle('on', !!testo);
        if (testo) { m.innerHTML = '<i data-lucide="' + (icona || 'film') + '"></i><span></span>'; m.querySelector('span').textContent = testo; icone(m); }
    }

    function mostraOra(T) {
        ultimoT = T;
        $('nvr-tl-ora').textContent = hms(T);
        $('nvr-video-ora').textContent = hms(T);
    }

    /* ---------- avvio / ritorno all'app ---------- */
    async function avvia() {
        try {
            const d = await (await fetch('/api/nvr/riassunto', { cache: 'no-store' })).json();
            cams = d.telecamere || [];
        } catch (e) { cams = []; }
        if (!cams.length) { $('nvr-chips').innerHTML = ''; $('nvr-elenco').innerHTML = '<div class="nvr-vuoto">Nessuna telecamera configurata.</div>'; return; }
        let salvata = null;
        try { salvata = parseInt(localStorage.getItem('nvr_cam') || '0', 10); } catch (e) {}
        if (!camId || !cams.some(c => c.id === camId)) camId = cams.some(c => c.id === salvata) ? salvata : cams[0].id;
        disegnaChips();
        misura();
        await caricaGiorni(true);
        // il giorno di oggi si aggiorna da solo: uno spezzone appena chiuso compare entro pochi secondi
        if (tAggiorna) clearInterval(tAggiorna);
        tAggiorna = setInterval(() => {
            if (document.hidden) return;
            if (!giorni.includes(oggi())) { caricaGiorni(false); return; }     // e' passata la mezzanotte
            if (giorno === oggi()) caricaGiorno(giorno, true);
        }, 10000);
    }

    window.nvrChiudi = function () {
        voleva = false;
        try { video.pause(); } catch (e) {}
        window.location.href = '/mobile';
    };
    document.addEventListener('visibilitychange', () => { if (!document.hidden && giorno === oggi()) caricaGiorno(giorno, true); });

    /* ---------- telecamere e giorni ---------- */
    function disegnaChips() {
        const box = $('nvr-chips');
        box.innerHTML = '';
        cams.forEach(c => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'nvr-chip' + (c.id === camId ? ' attiva' : '');
            b.innerHTML = '<i data-lucide="cctv"></i><span data-no-tr></span>';
            b.querySelector('span').textContent = c.nome;
            b.onclick = () => scegliCam(c.id);
            box.appendChild(b);
        });
        icone(box);
        const c = cams.find(x => x.id === camId);
        $('nvr-video-cam-n').textContent = c ? c.nome : '';
    }

    async function scegliCam(id) {
        if (id === camId) return;
        camId = id;
        try { localStorage.setItem('nvr_cam', String(id)); } catch (e) {}
        disegnaChips();
        fermaVideo();
        await caricaGiorni(true);
    }

    // i giorni arrivano dall'archivio (con numero di spezzoni e MB): la striscia li mostra tutti
    async function caricaArchivio() {
        try {
            archivio = await (await fetch('/api/nvr/archivio', { cache: 'no-store' })).json();
        } catch (e) { archivio = null; }
        giorniInfo = {};
        const t = archivio && (archivio.telecamere || []).find(x => x.id === camId);
        (t ? t.giorni : []).forEach(g => { giorniInfo[g.giorno] = g; });
        return Object.keys(giorniInfo);
    }

    async function caricaGiorni(vaiUltimo) {
        giorni = await caricaArchivio();
        if (!giorni.includes(oggi())) giorni.push(oggi());
        giorni.sort();
        const g = (vaiUltimo || !giorno || !giorni.includes(giorno)) ? giorni[giorni.length - 1] : giorno;
        disegnaGiorni();
        await caricaGiorno(g);
    }

    function disegnaGiorni() {
        const box = $('nvr-giorni');
        box.innerHTML = '';
        giorni.forEach(g => {
            const b = document.createElement('button');
            const info = giorniInfo[g];
            b.type = 'button'; b.className = 'nvr-g' + (g === giorno ? ' attivo' : '') + (g === oggi() ? ' oggi' : '') + (info ? '' : ' vuoto');
            b.dataset.g = g;
            b.innerHTML = '<b></b><small></small>';
            b.querySelector('b').textContent = etichettaGiorno(g, true);
            b.querySelector('small').textContent = info ? (info.n + ' · ' + mega(info.mb)) : '·';
            b.onclick = () => { if (g !== giorno) { fermaVideo(); caricaGiorno(g); } };
            box.appendChild(b);
        });
        const i = giorni.indexOf(giorno);
        $('nvr-g-prev').disabled = i <= 0;
        $('nvr-g-next').disabled = i >= giorni.length - 1;
        centraGiorno(box);
    }

    // centra il chip del giorno scelto SOLO in orizzontale (scrollIntoView farebbe scorrere anche la pagina)
    function centraGiorno(box) {
        const att = box.querySelector('.nvr-g.attivo');
        if (!att) return;
        const x = att.offsetLeft - (box.clientWidth - att.offsetWidth) / 2;
        if (box.scrollTo) box.scrollTo({ left: Math.max(0, x) }); else box.scrollLeft = Math.max(0, x);
    }

    // aggiornamento leggero (tick di 10 s): numeri del chip di oggi dai dati del giorno, senza ricostruire nulla
    function aggiornaChipGiorno() {
        const b = document.querySelector('#nvr-giorni .nvr-g[data-g="' + giorno + '"]');
        if (!b) return;
        const mb = recs.reduce((a, r) => a + r.mb, 0);
        b.classList.toggle('vuoto', !recs.length);
        b.querySelector('small').textContent = recs.length ? (recs.length + ' · ' + mega(mb)) : '·';
    }

    window.nvrCambiaGiorno = function (dir) {
        const i = giorni.indexOf(giorno) + dir;
        if (i < 0 || i >= giorni.length) return;
        fermaVideo();
        caricaGiorno(giorni[i]);
    };

    async function caricaGiorno(g, silenzioso) {
        const nuovo = g !== giorno;
        try {
            const d = await (await fetch('/api/nvr/registrazioni?cam=' + camId + '&giorno=' + g, { cache: 'no-store' })).json();
            if (d.status === 'error') throw new Error(d.message);
            giorno = g; t0 = d.inizio_giorno; recs = d.registrazioni || []; eventi = d.eventi || []; inCorso = d.in_corso || null;
            if (d.segmento_sec) segmentoSec = d.segmento_sec;
            archivioOk = d.archivio_ok !== false;
            DUR = (d.fine_giorno && d.fine_giorno > t0) ? d.fine_giorno - t0 : 86400;
        } catch (e) {
            if (!silenzioso) { $('nvr-elenco').innerHTML = '<div class="nvr-vuoto">Errore nel caricamento delle registrazioni.</div>'; }
            return;
        }
        if (nuovo) gruppiChiusi.clear();
        $('nvr-avviso').classList.toggle('on', !archivioOk);
        $('nvr-rec').classList.toggle('on', !!inCorso && giorno === oggi());
        $('nvr-video-cam-g').textContent = ' · ' + etichettaGiorno(giorno);
        if (nuovo) disegnaGiorni(); else aggiornaChipGiorno();
        prossimoSpezzone();
        disegna();
        elenco();
        if (nuovo) {
            // cursore all'ultimo spezzone del giorno (o adesso, se e' oggi e non c'e' niente)
            const T = recs.length ? recs[recs.length - 1].inizio : (giorno === oggi() ? Date.now() / 1000 : t0 + DUR / 2);
            mostraOra(T);
            scrollA(T, false);
            messaggio(recs.length ? 'Premi play o tocca la linea del tempo' : (inCorso ? 'Registrazione in corso: il primo spezzone arriva tra pochi minuti' : 'Nessuna registrazione in questo giorno'), recs.length ? 'film' : 'video-off');
        }
    }

    // "prossimo spezzone tra N min": ffmpeg chiude un file ogni segmentoSec secondi dall'avvio
    function prossimoSpezzone() {
        const el = $('nvr-live');
        if (!inCorso || giorno !== oggi()) { el.innerHTML = ''; return; }
        const passati = Math.max(0, Date.now() / 1000 - inCorso.da);
        const manca = segmentoSec - (passati % segmentoSec);
        const min = Math.ceil(manca / 60);
        // due pezzi separati: cosi' la frase fissa si traduce e il tempo resta com'e'
        if (!el.children.length) el.innerHTML = '<b>REC</b> <span>In registrazione · il prossimo spezzone arriva tra</span> <span></span>';
        el.children[2].textContent = manca < 60 ? 'meno di un minuto' : (min + ' min');
    }

    /* ---------- linea del tempo (canvas) ---------- */
    // La pista e' lunga 24 ore piu' mezza schermata per lato (cosi' il cursore arriva a 00:00 e 24:00).
    // La tela disegnata copre al massimo 3 schermate e viene spostata/ridisegnata scorrendo:
    // a zoom stretto la pista intera sarebbe troppo larga per una tela sola.
    function misura() {
        W = scroll.clientWidth || P.clientWidth - 28;
        pxs = W / finestra;
        larg = Math.round(W + DUR * pxs);
        cw = Math.min(larg, 3 * W);
        pista.style.width = larg + 'px';
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = cw * dpr; canvas.height = ALT * dpr;
        canvas.style.width = cw + 'px'; canvas.style.height = ALT + 'px';
        canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        disegnatoDa = -1;
        posiziona(true);
    }
    const x2T = x => t0 + (x - W / 2) / pxs;
    const T2x = T => W / 2 + (T - t0) * pxs;

    function posiziona(forza) {
        const sl = scroll.scrollLeft;
        if (!forza && sl >= disegnatoDa + W * 0.5 && sl + W <= disegnatoDa + cw - W * 0.5) return;
        if (!forza && cw >= larg && disegnatoDa === 0) return;
        disegnatoDa = Math.max(0, Math.min(larg - cw, Math.round(sl - W)));
        canvas.style.left = disegnatoDa + 'px';
        disegna();
    }

    function passi() {
        const etic = [60, 300, 600, 900, 1800, 3600, 7200, 10800, 21600].find(s => s * pxs >= 58) || 21600;
        const minore = [5, 10, 30, 60, 300, 600, 900, 1800, 3600].find(s => s * pxs >= 7 && etic % s === 0) || etic;
        return [etic, minore];
    }

    function disegna() {
        if (!W) { misura(); return; }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        ctx.setTransform(dpr, 0, 0, dpr, -disegnatoDa * dpr, 0);   // coordinate della pista intera
        const [etic, minore] = passi();
        const adesso = Date.now() / 1000;
        const da = disegnatoDa, a = disegnatoDa + cw;               // parte visibile della pista
        // ore future (solo oggi) piu' scure
        if (giorno === oggi() && adesso < t0 + DUR) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(T2x(adesso), 0, larg, ALT);
        }
        // righello
        ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '600 10px -apple-system, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.beginPath();
        for (let s = 0; s <= DUR; s += minore) {
            const x = Math.round(T2x(t0 + s)) + 0.5;
            if (x < da - 40 || x > a + 40) continue;
            const grande = s % etic === 0;
            ctx.moveTo(x, grande ? 19 : 23); ctx.lineTo(x, 27);
            if (grande && s < DUR) ctx.fillText(hm(t0 + s), x, 5);
        }
        ctx.moveTo(da, 27.5); ctx.lineTo(a, 27.5);
        ctx.stroke();
        // spezzoni registrati
        const blocco = (a, b, colore) => {
            const x1 = T2x(a), x2 = Math.max(T2x(b), x1 + 1.5);
            ctx.fillStyle = colore;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x1, 34, x2 - x1, 36, 3); ctx.fill(); } else ctx.fillRect(x1, 34, x2 - x1, 36);
        };
        // spezzoni uno dietro l'altro (stessa registrazione spezzata in file) = un blocco solo
        let b0 = null;
        recs.forEach(r => {
            if (b0 && r.inizio - b0.fine < 2 && r.motivo === b0.motivo) { b0.fine = Math.max(b0.fine, r.fine); return; }
            if (b0) blocco(b0.inizio, b0.fine, b0.motivo === 'eventi' ? '#3DA0FF' : '#0A84FF');
            b0 = { inizio: r.inizio, fine: r.fine, motivo: r.motivo };
        });
        if (b0) blocco(b0.inizio, b0.fine, b0.motivo === 'eventi' ? '#3DA0FF' : '#0A84FF');
        if (inCorso && giorno === oggi()) blocco(Math.max(inCorso.da, t0, recs.length ? recs[recs.length - 1].fine : 0), adesso, '#FF453A');
        // eventi (sensori)
        ctx.fillStyle = '#FFD60A';
        eventi.forEach(e => {
            const x = T2x(e.ts);
            ctx.beginPath(); ctx.moveTo(x, 74); ctx.lineTo(x + 5, 80); ctx.lineTo(x, 86); ctx.lineTo(x - 5, 80); ctx.closePath(); ctx.fill();
        });
        // "adesso"
        if (giorno === oggi() && adesso < t0 + DUR) {
            const x = Math.round(T2x(adesso)) + 0.5;
            ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.setLineDash([3, 3]);
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ALT); ctx.stroke(); ctx.setLineDash([]);
        }
    }

    function scrollA(T, morbido) {
        const x = Math.max(0, (T - t0) * pxs);
        if (morbido && scroll.scrollTo) scroll.scrollTo({ left: x, behavior: 'smooth' }); else scroll.scrollLeft = x;
    }

    window.nvrZoom = function (sec) {
        finestra = sec;
        document.querySelectorAll('#nvr-zoom button').forEach(b => b.classList.toggle('attivo', +b.dataset.z === sec));
        misura(); disegna();
        scrollA(ultimoT, false);
    };

    // scorrere la linea = cercare nel tempo; fermandosi si salta a quell'istante
    scroll.addEventListener('scroll', () => {
        posiziona();
        if (!scrubbing) return;            // scorrimento comandato dal codice: l'ora esatta e' gia' scritta
        const T = x2T(scroll.scrollLeft + W / 2);
        mostraOra(T);
        clearTimeout(tScrub);
        tScrub = setTimeout(() => { scrubbing = false; cerca(T); }, 260);
    }, { passive: true });
    const iniziaScrub = () => { scrubbing = true; clearTimeout(tScrub); if (!video.paused) video.pause(); };
    // se dopo il tocco/rotella non arriva ne' uno scorrimento ne' un click, lo scrub deve finire lo stesso
    const chiudiScrub = () => { clearTimeout(tScrub); tScrub = setTimeout(() => { if (!scrubbing) return; scrubbing = false; cerca(ultimoT); }, 400); };
    scroll.addEventListener('touchstart', () => { iniziaScrub(); dragMosso = 0; }, { passive: true });
    scroll.addEventListener('touchmove', () => { dragMosso = 10; }, { passive: true });
    scroll.addEventListener('touchend', chiudiScrub, { passive: true });
    scroll.addEventListener('touchcancel', chiudiScrub, { passive: true });
    scroll.addEventListener('wheel', e => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { iniziaScrub(); chiudiScrub(); } }, { passive: true });
    // col mouse: trascina per scorrere
    scroll.addEventListener('mousedown', e => { dragX = e.clientX; dragScroll = scroll.scrollLeft; dragMosso = 0; });
    window.addEventListener('mousemove', e => {
        if (dragX === null) return;
        if (!(e.buttons & 1)) { dragX = null; return; }   // tasto lasciato fuori dalla finestra
        const dx = e.clientX - dragX;
        if (Math.abs(dx) > 4 && !dragMosso) { dragMosso = 1; iniziaScrub(); }
        if (dragMosso) scroll.scrollLeft = dragScroll - dx;
    });
    window.addEventListener('mouseup', () => { dragX = null; });
    pista.addEventListener('click', e => {
        if (dragMosso) { dragMosso = 0; return; }
        const r = pista.getBoundingClientRect();
        vaiA(x2T(e.clientX - r.left));
    });
    // se il dito si ferma senza scorrere (tocco secco) il click qui sopra fa il salto

    /* ---------- riproduzione ---------- */
    function fermaVideo() {
        corrente = null; voleva = false;
        try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
        $('nvr-scarica').style.display = 'none';
        aggiornaPlay();
        document.querySelectorAll('#nvr-elenco .nvr-riga.attiva').forEach(r => r.classList.remove('attiva'));
    }

    function vaiA(T) {
        scrubbing = false; clearTimeout(tScrub);
        mostraOra(T);
        scrollA(T, true);
        cerca(T);
    }

    function cerca(T) {
        let r = recs.find(x => x.inizio <= T && T < x.fine);
        if (!r) {
            r = recs.find(x => x.inizio > T);
            if (r) { T = r.inizio; mostraOra(T); scrollA(T, true); }
        }
        if (!r) {
            corrente = null;
            try { video.pause(); } catch (e) {}
            aggiornaPlay();
            messaggio(inCorso && giorno === oggi() && T >= inCorso.da ? 'Registrazione in corso: lo spezzone arriva tra pochi minuti' : 'Nessuna registrazione dopo quest\'ora', 'video-off');
            return;
        }
        carica(r, T - r.inizio);
    }

    function carica(r, offset) {
        messaggio('');
        offset = Math.max(0, offset || 0);
        offsetAtteso = offset;
        if (corrente && corrente.id === r.id) {
            if (video.readyState >= 1) { video.currentTime = Math.min(offset, Math.max(0, (video.duration || offset) - 0.2)); video.playbackRate = velocita; }
            if (voleva) video.play().catch(() => {});
            return;                    // file non ancora pronto: alPronto usera' offsetAtteso
        }
        corrente = r;
        $('nvr-scarica').href = r.url + '?scarica=1';
        $('nvr-scarica').style.display = 'flex';
        document.querySelectorAll('#nvr-elenco .nvr-riga').forEach(x => x.classList.toggle('attiva', x.dataset.id === String(r.id)));
        video.src = r.url;
        video.load();
        const alPronto = () => {
            video.removeEventListener('loadedmetadata', alPronto);
            if (corrente !== r) return;
            const off = offsetAtteso;
            video.playbackRate = velocita;          // load() riporta la velocita' a 1: si rimette quella scelta
            // il file e' piu' corto di quanto dice l'indice (spezzone interrotto): si passa al successivo
            if (video.duration && off >= video.duration - 0.5) { alFine(); return; }
            try { video.currentTime = Math.min(off, Math.max(0, (video.duration || off) - 0.2)); } catch (e) {}
            if (voleva) video.play().catch(() => {});
        };
        video.addEventListener('loadedmetadata', alPronto);
    }

    // fine dello spezzone: si continua col successivo, senza interruzioni
    function alFine() {
        const i = corrente ? recs.findIndex(x => x.id === corrente.id) : -1;
        const r = recs[i + 1];
        if (r) { carica(r, 0); scrollA(r.inizio, false); mostraOra(r.inizio); return; }
        voleva = false; aggiornaPlay();
        messaggio(inCorso && giorno === oggi() ? 'Sei arrivato alla registrazione in corso' : 'Fine delle registrazioni del giorno', 'check-circle-2');
    }

    function aggiornaPlay() {
        const b = $('nvr-play');
        b.innerHTML = '<i data-lucide="' + (voleva && corrente && !video.paused ? 'pause' : 'play') + '"></i>';
        icone(b);
    }

    window.nvrPlayPausa = function () {
        if (navigator.vibrate) navigator.vibrate(30);
        if (corrente && !video.paused) { voleva = false; video.pause(); return; }
        voleva = true;
        if (corrente && video.ended) { alFine(); return; }
        if (corrente) video.play().catch(() => {}); else cerca(ultimoT);
    };
    window.nvrAvanza = function (s) { vaiA(ultimoT + s); };
    window.nvrSalta = function (dir) {
        if (!recs.length) return;
        let i = corrente ? recs.findIndex(x => x.id === corrente.id) : -1;
        if (i < 0) i = dir > 0 ? recs.findIndex(x => x.inizio > ultimoT) - 1 : recs.findIndex(x => x.inizio > ultimoT);
        if (i < 0 && dir < 0) i = recs.length;
        const r = recs[i + dir];
        if (!r) return;
        if (dir < 0 && corrente && video.currentTime > 3) { vaiA(corrente.inizio); return; }
        vaiA(r.inizio);
    };
    // un solo tasto che gira: 1x -> 2x -> 4x -> 8x -> 1x
    window.nvrVelocita = function () {
        const v = velocita >= 8 ? 1 : velocita * 2;
        velocita = v;
        video.playbackRate = v; video.defaultPlaybackRate = v;
        const b = $('nvr-vel');
        b.textContent = v + '\u00d7';
        b.classList.toggle('veloce', v !== 1);
    };
    window.nvrSchermoIntero = function () {
        if (video.webkitEnterFullscreen && !document.fullscreenEnabled) { try { video.webkitEnterFullscreen(); } catch (e) {} return; }
        const box = $('nvr-video-box');
        if (document.fullscreenElement) document.exitFullscreen(); else if (box.requestFullscreen) box.requestFullscreen(); else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    };

    video.addEventListener('timeupdate', () => {
        if (!corrente) return;
        const T = corrente.inizio + video.currentTime;
        mostraOra(T);
        if (!scrubbing && !video.paused) scroll.scrollLeft = (T - t0) * pxs;
    });
    ['play', 'pause', 'playing', 'waiting', 'seeked'].forEach(ev => video.addEventListener(ev, aggiornaPlay));
    video.addEventListener('ended', alFine);
    video.addEventListener('pause', () => {
        // certi browser si fermano in fondo al file senza mandare "ended"
        if (voleva && corrente && !video.ended && video.duration && video.currentTime >= video.duration - 0.15) alFine();
    });
    video.addEventListener('error', () => {
        if (!corrente) return;
        messaggio('Spezzone non leggibile', 'alert-circle');
    });
    window.addEventListener('resize', () => { misura(); disegna(); scrollA(ultimoT, false); });

    /* ---------- elenco del giorno: a gruppi di un'ora, come cartelle ---------- */
    function elenco() {
        const box = $('nvr-elenco');
        const rie = $('nvr-riepilogo');
        const voci = recs.map(r => ({ t: r.inizio, rec: r })).concat(eventi.map(e => ({ t: e.ts, ev: e }))).sort((a, b) => a.t - b.t);
        const secTot = recs.reduce((a, r) => a + r.durata, 0), mbTot = recs.reduce((a, r) => a + r.mb, 0);
        rie.innerHTML = '';
        if (recs.length) {
            // numeri e parole separati: le parole si traducono, i numeri restano
            rie.innerHTML = '<b></b> <span>spezzoni</span> · <b></b> · <b></b>' + (eventi.length ? ' · <b></b> <span>eventi</span>' : '');
            const b = rie.querySelectorAll('b');
            b[0].textContent = recs.length; b[1].textContent = durata(secTot); b[2].textContent = mega(mbTot);
            if (eventi.length) b[3].textContent = eventi.length;
        }
        $('nvr-del-giorno').style.display = (ADMIN && recs.length) ? 'inline-flex' : 'none';
        $('nvr-del-giorno').disabled = !archivioOk;
        box.innerHTML = '';
        if (!voci.length) { box.innerHTML = '<div class="nvr-vuoto">Nessuna registrazione in questo giorno</div>'; return; }
        // gruppi per ora del giorno
        const gruppi = new Map();
        voci.forEach(v => {
            const h = Math.floor((v.t - t0) / 3600);
            if (!gruppi.has(h)) gruppi.set(h, []);
            gruppi.get(h).push(v);
        });
        gruppi.forEach((lista, h) => {
            const g = document.createElement('div');
            const chiave = giorno + '#' + h;
            g.className = 'nvr-gruppo' + (gruppiChiusi.has(chiave) ? ' chiuso' : '');
            const nRec = lista.filter(v => v.rec).length, nEv = lista.length - nRec;
            const mb = lista.reduce((a, v) => a + (v.rec ? v.rec.mb : 0), 0);
            g.innerHTML = '<div class="nvr-gruppo-h" role="button" tabindex="0"><span class="ora"></span><span class="info"></span><i data-lucide="chevron-down" class="chev"></i></div><div class="nvr-gruppo-c"></div>';
            g.querySelector('.ora').textContent = hm(t0 + h * 3600) + ' – ' + hm(t0 + (h + 1) * 3600);
            const info = g.querySelector('.info');
            info.innerHTML = '<b></b> <span>spezzoni</span>' + (mb ? ' · <b></b>' : '') + (nEv ? ' · <b></b> <span>eventi</span>' : '');
            const bb = info.querySelectorAll('b'); bb[0].textContent = nRec;
            if (mb) bb[1].textContent = mega(mb);
            if (nEv) bb[mb ? 2 : 1].textContent = nEv;
            const gh = g.querySelector('.nvr-gruppo-h');
            gh.setAttribute('aria-expanded', String(!g.classList.contains('chiuso')));
            gh.onclick = () => {
                g.classList.toggle('chiuso');
                gh.setAttribute('aria-expanded', String(!g.classList.contains('chiuso')));
                if (g.classList.contains('chiuso')) gruppiChiusi.add(chiave); else gruppiChiusi.delete(chiave);
            };
            gh.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gh.click(); } };
            const c = g.querySelector('.nvr-gruppo-c');
            lista.forEach(v => c.appendChild(rigaVoce(v)));
            box.appendChild(g);
        });
        icone(box);
    }

    function rigaVoce(v) {
        const riga = document.createElement('div');
        if (v.rec) {
            const r = v.rec;
            riga.className = 'nvr-riga' + (corrente && corrente.id === r.id ? ' attiva' : '');
            riga.dataset.id = r.id;
            const min = Math.round(r.durata / 60);
            riga.innerHTML = '<div class="nvr-riga-ico"><i data-lucide="film"></i></div><div style="flex:1; min-width:0;"><div class="nvr-riga-n"></div><div class="nvr-riga-s"></div></div>'
                + '<a class="nvr-ib" title="Scarica" download><i data-lucide="download"></i></a>'
                + (ADMIN ? '<button type="button" class="nvr-ib nvr-del pericolo" title="Elimina"><i data-lucide="trash-2"></i></button>' : '');
            riga.querySelector('.nvr-riga-n').textContent = hm(r.inizio) + ' – ' + hm(r.fine);
            riga.querySelector('.nvr-riga-s').textContent = (min >= 1 ? min + ' min' : r.durata + ' s') + ' · ' + r.mb + ' MB · ' + (MOTIVI[r.motivo] || r.motivo || '');
            const a = riga.querySelector('a'); a.href = r.url + '?scarica=1'; a.onclick = e => e.stopPropagation();
            riga.onclick = () => { voleva = true; vaiA(r.inizio); };
            const del = riga.querySelector('.nvr-del');
            if (del) del.onclick = async e => {
                e.stopPropagation();
                const ok = await chiedi(hm(r.inizio) + ' – ' + hm(r.fine) + '\nIl file viene cancellato dall\'archivio.', { titolo: 'Eliminare lo spezzone?', si: 'Elimina', pericolo: true, icona: 'trash-2' });
                if (!ok) return;
                try { await fetch('/api/nvr/registrazione/' + r.id, { method: 'DELETE' }); } catch (x) {}
                if (corrente && corrente.id === r.id) fermaVideo();
                await caricaGiorni(false);
            };
        } else {
            const e = v.ev;
            riga.className = 'nvr-riga evento';
            riga.innerHTML = '<div class="nvr-riga-ico"><i data-lucide="zap"></i></div><div style="flex:1; min-width:0;"><div class="nvr-riga-n"></div><div class="nvr-riga-s"></div></div>';
            riga.querySelector('.nvr-riga-n').textContent = hms(e.ts);
            riga.querySelector('.nvr-riga-s').textContent = (e.entita || '') + (e.stato ? ' → ' + e.stato : '');
            riga.onclick = () => { voleva = true; vaiA(e.ts - 3); };
        }
        return riga;
    }

    /* ---------- cancellazioni in blocco ---------- */
    async function cancella(corpo, testo, titolo) {
        if (!archivioOk && !corpo.senza_file) { avvisa('Unità di archivio non collegata: collegala e riprova.', { titolo: 'Archivio', icona: 'usb' }); return false; }
        const ok = await chiedi(testo, { titolo: titolo, si: 'Elimina', pericolo: true, icona: 'trash-2' });
        if (!ok) return false;
        let d = null;
        try { d = await (await fetch('/api/nvr/registrazioni', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) })).json(); } catch (e) {}
        if (!d || d.status !== 'success') { avvisa((d && d.message) || 'Cancellazione non riuscita', { titolo: 'Archivio', icona: 'alert-circle' }); return false; }
        fermaVideo();
        await caricaGiorni(false);
        if ($('nvr-sheet').classList.contains('on')) disegnaArchivio();
        return true;
    }

    window.nvrEliminaGiorno = function () {
        const c = cams.find(x => x.id === camId);
        cancella({ cam: camId, giorno: giorno }, (c ? c.nome + ' – ' : '') + etichettaGiorno(giorno) + '\nTutti gli spezzoni di questo giorno vengono cancellati dall\'archivio.', 'Eliminare il giorno?');
    };

    /* ---------- archivio (cartelle) ---------- */
    let focusPrima = null;
    window.nvrApriArchivio = async function () {
        focusPrima = document.activeElement;
        $('nvr-velo').classList.add('on'); $('nvr-sheet').classList.add('on'); $('nvr-sheet').setAttribute('aria-hidden', 'false');
        $('nvr-arch-c').innerHTML = '<div class="nvr-vuoto">Caricamento...</div>';
        const chiudi = $('nvr-sheet').querySelector('.nvr-sheet-h button'); if (chiudi) chiudi.focus();
        await caricaArchivio();
        disegnaArchivio();
    };
    window.nvrChiudiArchivio = function () {
        $('nvr-velo').classList.remove('on'); $('nvr-sheet').classList.remove('on'); $('nvr-sheet').setAttribute('aria-hidden', 'true');
        if (focusPrima && focusPrima.focus) { try { focusPrima.focus(); } catch (e) {} }
    };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') nvrChiudiArchivio(); });

    function disegnaArchivio() {
        const box = $('nvr-arch-c');
        $('nvr-arch-cartella').textContent = (archivio && archivio.cartella) || '';
        if (!archivio) { box.innerHTML = '<div class="nvr-vuoto">Archivio non raggiungibile.</div>'; return; }
        box.innerHTML = '';
        // spazio dell'unita': registrazioni / altro / libero
        const sp = archivio.spazio;
        const spazio = document.createElement('div'); spazio.className = 'nvr-spazio';
        if (sp && sp.totale_gb) {
            const usatoReg = archivio.totale.gb, altro = Math.max(0, sp.totale_gb - sp.libero_gb - usatoReg);
            spazio.innerHTML = '<div class="nvr-spazio-r"><span><b></b> <span>registrazioni</span> · <b></b></span><span><b></b> <span>liberi di</span> <b></b></span></div>'
                + '<div class="nvr-barra"><i></i><i class="altro"></i></div>'
                + '<div class="nvr-spazio-l"><span>Registrazioni</span><span class="altro">Altro</span><span class="libero">Libero</span></div>';
            const b = spazio.querySelectorAll('.nvr-spazio-r b');
            b[0].textContent = archivio.totale.n; b[1].textContent = usatoReg.toFixed(usatoReg < 10 ? 2 : 1) + ' GB';
            b[2].textContent = sp.libero_gb.toFixed(1) + ' GB'; b[3].textContent = sp.totale_gb.toFixed(0) + ' GB';
            const bar = spazio.querySelectorAll('.nvr-barra i');
            bar[0].style.width = (100 * usatoReg / sp.totale_gb).toFixed(2) + '%'; bar[1].style.width = (100 * altro / sp.totale_gb).toFixed(2) + '%';
        } else {
            spazio.innerHTML = '<div class="nvr-spazio-r"><span><b></b> <span>registrazioni</span> · <b></b></span><span>' + (archivio.archivio_ok ? '' : 'Unità non collegata') + '</span></div>';
            const b = spazio.querySelectorAll('b'); b[0].textContent = archivio.totale.n; b[1].textContent = archivio.totale.gb.toFixed(2) + ' GB';
        }
        box.appendChild(spazio);
        // una "cartella" per telecamera, dentro le cartelle dei giorni
        (archivio.telecamere || []).forEach(t => {
            const cart = document.createElement('div');
            cart.className = 'nvr-cart' + (t.id === camId ? '' : ' chiusa');
            cart.innerHTML = '<div class="nvr-cart-h" role="button" tabindex="0"><div class="ico"><i data-lucide="folder"></i></div><div class="n"><b><span data-no-tr></span><span class="rimossa"></span></b><small></small></div>'
                + (ADMIN && t.n ? '<button type="button" class="nvr-ib pericolo" title="Elimina tutte le registrazioni della telecamera"' + (archivio.archivio_ok ? '' : ' disabled') + '><i data-lucide="trash-2"></i></button>' : '')
                + '<i data-lucide="chevron-down" class="chev"></i></div><div class="nvr-cart-c"></div>';
            cart.querySelector('b span').textContent = t.nome;
            cart.querySelector('b .rimossa').textContent = t.presente ? '' : ' (rimossa)';
            const small = cart.querySelector('small');
            small.innerHTML = '<span data-no-tr></span> · <b></b> <span>spezzoni</span> · <b></b>';
            small.querySelector('span').textContent = t.cartella + '/';
            const sb = small.querySelectorAll('b'); sb[0].textContent = t.n; sb[1].textContent = t.gb.toFixed(2) + ' GB';
            const testa = cart.querySelector('.nvr-cart-h');
            testa.onclick = e => { if (!e.target.closest('button')) { cart.classList.toggle('chiusa'); testa.setAttribute('aria-expanded', String(!cart.classList.contains('chiusa'))); } };
            testa.setAttribute('aria-expanded', String(!cart.classList.contains('chiusa')));
            testa.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); testa.click(); } };
            const delCam = cart.querySelector('.nvr-cart-h button');
            if (delCam) delCam.onclick = () => cancella({ cam: t.id }, t.nome + '\nTutte le registrazioni di questa telecamera vengono cancellate dall\'archivio.', 'Eliminare la telecamera dall\'archivio?');
            const c = cart.querySelector('.nvr-cart-c');
            if (!t.giorni.length) { c.innerHTML = '<div class="nvr-cart-vuota">Nessuna registrazione</div>'; }
            t.giorni.forEach(g => {
                const r = document.createElement('div');
                r.className = 'nvr-cart-g' + (t.id === camId && g.giorno === giorno ? ' attuale' : '');
                r.setAttribute('role', 'button'); r.tabIndex = 0;
                r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); r.click(); } };
                r.innerHTML = '<div class="ico"><i data-lucide="calendar"></i></div><div class="n"><b><span></span> · <span data-no-tr></span></b><small></small></div>'
                    + (ADMIN ? '<button type="button" class="nvr-ib pericolo" title="Elimina il giorno"' + (archivio.archivio_ok ? '' : ' disabled') + '><i data-lucide="trash-2"></i></button>' : '');
                r.querySelector('b span').textContent = etichettaGiorno(g.giorno);
                r.querySelector('b span[data-no-tr]').textContent = g.giorno;
                const s2 = r.querySelector('small');
                s2.innerHTML = '<b></b> <span>spezzoni</span> · <b></b> · <b></b>';
                const b2 = s2.querySelectorAll('b'); b2[0].textContent = g.n; b2[1].textContent = durata(g.sec); b2[2].textContent = mega(g.mb);
                r.onclick = async e => {
                    if (e.target.closest('button')) return;
                    nvrChiudiArchivio();
                    if (t.id !== camId) { camId = t.id; try { localStorage.setItem('nvr_cam', String(t.id)); } catch (x) {} disegnaChips(); fermaVideo(); giorni = await caricaArchivio(); if (!giorni.includes(oggi())) giorni.push(oggi()); giorni.sort(); }
                    else fermaVideo();
                    caricaGiorno(g.giorno);
                };
                const del = r.querySelector('button');
                if (del) del.onclick = () => cancella({ cam: t.id, giorno: g.giorno }, t.nome + ' – ' + etichettaGiorno(g.giorno) + '\nTutti gli spezzoni di questo giorno vengono cancellati dall\'archivio.', 'Eliminare il giorno?');
                c.appendChild(r);
            });
            box.appendChild(cart);
        });
        // azioni in fondo
        if (ADMIN) {
            const az = document.createElement('div'); az.className = 'nvr-azioni';
            if (archivio.senza_file) {
                const b = document.createElement('button'); b.type = 'button'; b.className = 'nvr-btn';
                b.innerHTML = '<i data-lucide="broom"></i><span>Rimuovi le voci senza file</span> <b data-no-tr>(' + archivio.senza_file + ')</b>';
                b.onclick = async () => {
                    try { await fetch('/api/nvr/registrazioni', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senza_file: true }) }); } catch (e) {}
                    await caricaGiorni(false); disegnaArchivio();
                };
                az.appendChild(b);
            }
            const tutto = document.createElement('button'); tutto.type = 'button'; tutto.className = 'nvr-btn pericolo'; tutto.disabled = !archivio.totale.n || !archivio.archivio_ok;
            tutto.innerHTML = '<i data-lucide="trash-2"></i><span>Svuota l\'archivio</span>';
            tutto.onclick = () => cancella({ tutto: true }, 'Tutte le registrazioni di tutte le telecamere vengono cancellate dall\'unità. Le telecamere attive ricominciano a registrare subito dopo.', 'Svuotare tutto l\'archivio?');
            az.appendChild(tutto);
            box.appendChild(az);
        }
        const nota = document.createElement('div'); nota.className = 'nvr-sez-s'; nota.style.padding = '0 4px';
        nota.innerHTML = '<span>Sull\'unità i file stanno in</span> <span>telecamera / giorno / ora.mp4</span><span>; le registrazioni più vecchie di</span> <b></b> <span>giorni vengono cancellate da sole.</span>';
        nota.querySelector('b').textContent = archivio.giorni_conservazione;
        box.appendChild(nota);
        icone(box);
    }

    if (window.lucide) lucide.createIcons();
    avvia();
})();
</script>
</body>
</html>
